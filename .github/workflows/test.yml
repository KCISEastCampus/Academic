name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    name: Frontend build and behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build site and search index
        run: |
          bundle exec jekyll build
          npx --yes pagefind --site _site
      - name: Test shared frontend
        run: |
          node scripts/test-exam-topic-integration.js
          node scripts/test-site-language.js
          node scripts/test-subject-index-translations.js
          node scripts/test-igcse-mathematics-sample.js
          node scripts/test-igcse-mathematics-content.js
          node scripts/test-igcse-mathematics-calculations.js
          node scripts/test-search-language.js
          node scripts/test-search-excerpts.js
          node scripts/test-search-interaction.js
          node scripts/test-frontend-loading.js
          node scripts/test-frontend-ux.js
          node scripts/test-reading-layout.js
          node scripts/test-exam-timetable.js
          node scripts/test-theme-init.js
          node scripts/test-image-modal.js
      - name: Test complete AS chemistry course
        run: node scripts/test-chemistry-as-foundations.js

      - name: Test physics lessons and bilingual content
        run: |
          node scripts/test-physics-learning-pilots.js
          node scripts/test-physics-as-dynamics.js
          node scripts/test-physics-circular.js
          node scripts/test-physics-shm.js
          node scripts/test-physics-gravity.js
          node scripts/test-physics-electric.js
          node scripts/test-physics-capacitance.js
          node scripts/test-physics-charge-discharge.js
          node scripts/test-physics-radioactive.js
          node scripts/test-physics-magnetic.js
          node scripts/test-physics-electromagnetism.js
          node scripts/test-physics-thermal.js
          node scripts/test-physics-nuclear.js
          node scripts/test-physics-bilingual.js

      - name: Test mathematics courses and bilingual content
        run: |
          node scripts/test-bilingual.js
          for check in scripts/test-mechanics-*.js scripts/test-as-mathematics-*.js scripts/test-as-further-*.js scripts/test-further-*.js; do
            node "$check"
          done

      - name: Test MA03 pure mathematics lessons
        run: |
          node scripts/test-numerical-methods.js
          node scripts/test-binomial-series.js
          node scripts/test-trigonometry.js
          node scripts/test-exponential-logarithmic.js
          node scripts/test-differentiation.js
          node scripts/test-parametric-equations.js
          node scripts/test-differential-equations.js
          node scripts/test-integration-applications.js
          node scripts/test-vectors.js
          node scripts/test-pure-consistency.js
          node scripts/test-a2-heading-hierarchy.js

      - name: Test MA04 statistics course
        run: |
          node scripts/test-ma04-poisson.js
          node scripts/test-ma04-content.js
          node scripts/test-ma04-calculations.js

      - name: Test FM04 statistics course and mathematics navigation
        run: |
          node scripts/test-fm04-sample.js
          node scripts/test-fm04-content.js
          node scripts/test-fm04-calculations.js
          node scripts/test-math-hierarchy.js

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test reading progress
        run: node scripts/test-reading-progress.js

      - name: Test navigation accessibility
        run: node scripts/test-accessibility.js

      - name: Test TOC refresh
        run: node scripts/test-toc-refresh.js

      - name: Test back-to-top positioning
        run: node scripts/test-back-to-top.js

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint '**/*.md' --ignore vendor --ignore _site --ignore node_modules --ignore assets --ignore admin

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Run link check
        run: |
          find . -name "*.md" \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            -not -path "./_site/*" \
            -not -path "./node_modules/*" \
            | xargs markdown-link-check --config .markdown-link-check.json
        continue-on-error: true
