        url: /alevel/fx-cg50/advanced/mechanics/
      - anchor: ma05-conical-pendulum
        title: "圆锥摆：半径与绳长分别使用"
        url: /alevel/fx-cg50/advanced/mechanics/
      - anchor: ma05-energy
        title: "能量接抛体：离开斜面时的速度作初始条件"
        url: /alevel/fx-cg50/advanced/mechanics/
      - anchor: ma05-projectile
        title: "抛体：二次方程的两个根对应两次经过"
        url: /alevel/fx-cg50/advanced/mechanics/
      - anchor: ma05-moments
        title: "力矩：每个力乘自己的垂直距离"
        url: /alevel/fx-cg50/advanced/mechanics/
      - anchor: ma05-centre-of-mass
        title: "组合质心：先算质量加权坐标"
        url: /alevel/fx-cg50/advanced/mechanics/
      - anchor: ma05-collision
        title: "碰撞：动量带方向，动能取平方"
        url: /alevel/fx-cg50/advanced/mechanics/
      - anchor: ma05-vector-motion
        title: "向量运动：积分常数由初始条件决定"
        url: /alevel/fx-cg50/advanced/mechanics/

