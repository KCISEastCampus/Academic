council:
  name: A-level Student Council
  short_name: ALSC
  description: The A-level Student Council (ALSC) aims to organize activities,
    provide resources, help students relieve stress, and help them learn
    effectively.
executives:
  - name: Eric Shi
    role: President
    grade: G12
    class: 12H
    bio: From G12, with experience of leadership by being the class monitor for 4
      years, since G8. Built and maintaining <a
      href="https://kcisec.site">https://kcisec.site</a> since 2022.
    groups:
      - name: Academic
        role: Leader
      - name: Publicity
        role: Deputy Leader
  - name: Marcia Ma
    role: Vice President
    grade: G12
    class: 12H
    bio: From G12, experienced in organizational management, and have successfully
      managed the school's "Heartfelt Voice(心辅之声)" program for years.
    groups:
      - name: Publicity
        role: Leader
      - name: Events
        role: Deputy Leader
  - name: Jason Jiang
    role: Head of Events
    grade: G11
    class: 11H
    bio: TBD
    groups:
      - name: Events
        role: Leader
groups:
  - id: academic
    name: Academic
    leader_name_cn: 石洪斌
    icon: bi-book
    color: "#5cc07f"
    description: Maintaining this website and writing academic resources.
    responsibilities:
      - Maintain and update the Academic Resources website
      - Create and curate study materials
  - id: events
    name: Events
    leader_name_cn: 姜嘉鑫
    icon: bi-calendar-event
    color: "#5c6bc0"
    description: Planning and executing events from concept to completion.
    responsibilities:
      - Event planning and proposal development
      - Mid-stage event execution and coordination
      - Logistics and resource allocation
      - Venue coordination and participant management
  - id: publicity
    name: Publicity
    leader_name_cn: 马艺涵
    icon: bi-megaphone
    color: "#e67e22"
    description: Creating content, designing materials, and documenting our work.
    responsibilities:
      - Write official documents and announcements
      - Design posters and promotional materials
      - Post-event documentation and summaries
      - Social media management and outreach
