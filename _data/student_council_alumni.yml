# First Session A-level Student Council Alumni Data
# Session: 2024-2025 (First Session)

# Council Information
council:
  name: "A-level Student Council"
  short_name: "ALSC"
  session: "2024-2025"
  description: "The first session of the A-level Student Council (ALSC), established in 2024. This pioneering team laid the foundation for student governance and academic support at KCISEC A-level."

# Core Members / Executive Team
executives:
  - name: "Eric Shi"
    role: "President"
    grade: "G11"
    class: "11I"
    bio: "From G11, with experience of leadership by being the class monitor for 3 years, since G8. Built and maintaining <a href=\"https://kcisec.site\">https://kcisec.site</a> since 2022."
