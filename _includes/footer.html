{% assign ui = site.data.ui[page.lang] | default: site.data.ui.en %}
<footer class="py-3 border-top">
  <div class="container">
    <div class="d-flex flex-column align-items-center gap-2">
      <!-- Nav Links -->
      <nav class="footer-nav-links" data-site-ui lang="{{ page.lang | default: 'en' }}" data-ui-aria="footer_navigation" aria-label="{{ ui.footer_navigation }}">
        <a href="{% if page.lang == 'zh-CN' %}/zh/{% else %}/{% endif %}" class="footer-nav-link" data-ui="home">{{ ui.home }}</a>
        <a href="{% if page.lang == 'zh-CN' %}/zh{% endif %}/alevel/" class="footer-nav-link">A-Level</a>
        <a href="{% if page.lang == 'zh-CN' %}/zh{% endif %}/igcse/" class="footer-nav-link">IGCSE</a>
        <a href="/student-council/" class="footer-nav-link" data-ui="student_council">{{ ui.student_council }}</a>
        <a href="/contributors/" class="footer-nav-link" data-ui="contributors">{{ ui.contributors }}</a>
      </nav>
      <!-- Copyright + Counter -->
      <div class="d-flex align-items-center gap-2">
        <span class="text-muted" style="font-size: 0.78rem;">&copy; <script>document.write(new Date().getFullYear())</script> EricStoneChina & A-level Student Council</span>
        <span class="text-muted" style="font-size: 0.78rem;">·</span>
        <img id="hitscounter-badge" src="https://hitscounter.dev/api/hit?url=academic.kcisec.site&label=Academic&icon=brilliance&color=%23198754&message=&style=flat&tz=Asia/Hong_Kong" alt="hits" style="max-width: 180px; height: 20px; object-fit: contain; opacity: 0.7;">
        <script>
          (function () {
            var badge = document.getElementById('hitscounter-badge');
            if (!badge) return;
            var currentUrl = new URL(window.location.href);
            var pageLabel = "{{ page.title | default: site.title | default: 'Academic' | escape }}";
            currentUrl.hash = '';
            var isHomePage = currentUrl.pathname === '/' || currentUrl.pathname === '/index.html' || currentUrl.pathname === '/zh/' || currentUrl.pathname === '/zh/index.html';
            var counterUrl = isHomePage ? 'academic.kcisec.site' : currentUrl.toString();
            var counterLabel = isHomePage ? 'Academic' : pageLabel;
            var api = new URL('https://hitscounter.dev/api/hit');
            api.searchParams.set('url', counterUrl);
            api.searchParams.set('label', counterLabel);
            api.searchParams.set('icon', 'brilliance');
            api.searchParams.set('color', '#198754');
            api.searchParams.set('message', '');
            api.searchParams.set('style', 'flat');
            api.searchParams.set('tz', 'Asia/Hong_Kong');
            badge.src = api.toString();
          })();
        </script>
      </div>
    </div>
  </div>
</footer>
