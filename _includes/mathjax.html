<script>
  window.MathJax = {
    loader: {
      load: ['[tex]/mhchem'{% if include.mathml %}, 'input/mml'{% endif %}]{% if include.mathml %},
      paths: {mathjax: '/assets/vendor/mathjax/3.2.2/es5'}{% endif %}
    },
    startup: {
      {% if include.mathml %}typeset: false,{% endif %}
      ready: () => {
        MathJax.startup.defaultReady();
        MathJax.startup.promise.then(async () => {
          // Register a TeX preFilter that automatically promotes matrix environments
          // inside inline math ($...$) to display style, preventing them from being
          // compressed into the text baseline.
          MathJax.startup.input.find(input => input.name === 'TeX').preFilters.add(({math}) => {
            if (!math.display) {
              math.math = math.math.replace(
                /\\begin\{((?:p|b|B|v|V)?matrix|smallmatrix)\}/g,
                '\\displaystyle\\begin{$1}'
              );
            }
          });
          document.dispatchEvent(new Event('mathjaxLoaded'));
          // Typesetting changes page height after the browser's initial hash jump.
          if (window.location.hash) {
            if (document.readyState !== 'complete') {
              await new Promise(resolve => window.addEventListener('load', resolve, {once: true}));
            }
            await document.fonts.ready;
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            let anchorId = window.location.hash.slice(1);
            try { anchorId = decodeURIComponent(anchorId); } catch (_) {}
            const anchor = document.getElementById(anchorId);
            if (anchor) anchor.scrollIntoView({behavior: 'instant', block: 'start'});
          }
        });
      }
    },
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      tags: 'ams',
      tagSide: 'right',
      packages: {'[+]': ['base', 'ams', 'mhchem']},
      processEscapes: true,
      processEnvironments: true,
      macros: {
        cosec: '\\operatorname{cosec}',
        arccos: '\\cos^{-1}',
        arcsin: '\\sin^{-1}',
        arctan: '\\tan^{-1}',
        arccot: '\\cot^{-1}',
        arcsec: '\\sec^{-1}',
        arccosec: '\\cosec^{-1}'
      }
    },
    chtml: {
      // Force MathJax to use proper math fonts for all content including \text{}
  matchFontHeight: false,
  scale: 0.95,
  mtextInheritFont: false,  // Prevent \text from inheriting page font
  fontURL: '/assets/vendor/mathjax/3.2.2/es5/output/chtml/fonts/woff-v2'
    },
    svg: {
      fontCache: 'global',
      mtextInheritFont: false
    },
    options: {
      enableMenu: false,
      ignoreHtmlClass: 'tex-ignore',
      processHtmlClass: 'tex-process'
    }
  };
</script>
<!-- Load MathJax (full bundle with mhchem included): local first with CDN fallbacks -->
<script>
  (function() {
    const sources = [
      '/assets/vendor/mathjax/3.2.2/es5/tex-chtml-full.js',
      'https://cdn.bootcdn.net/ajax/libs/mathjax/3.2.2/es5/tex-chtml-full.js',
      'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js'
    ];

    const script = document.createElement('script');
    script.id = 'MathJax-script';
    script.defer = true;
    script.crossOrigin = 'anonymous';

    let index = 0;
    const tryNext = () => {
      if (index >= sources.length) {
        console.error('MathJax failed to load from all sources');
        return;
      }
      const src = sources[index++];
  console.info('Loading MathJax from', src);
      script.src = src;
    };

    script.onload = () => {
      console.log('MathJax loaded from', script.src);
    };

    script.onerror = () => {
      console.warn('MathJax failed to load from', script.src);
      tryNext();
    };

    tryNext();
    document.head.appendChild(script);
  })();
</script>
