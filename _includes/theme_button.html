<button id="theme_button" class="theme-toggle-btn" aria-label="Toggle theme" aria-pressed="false">
  <span class="theme-icon-stack" aria-hidden="true">
    <i class="bi bi-moon theme-icon theme-icon-moon"></i>
    <i class="bi bi-sun theme-icon theme-icon-sun"></i>
  </span>
  <span class="theme-label">Light</span>
</button>

<style>
  .theme-toggle-btn {
    position: fixed;
    /* 默认位置 - 用于学科页面 */
    top: 20px;
    right: 20px;
    z-index: 9999;
    background: var(--surface);
    border: 2px solid var(--muted);
    border-radius: 50px;
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(10px);
  }

  .theme-toggle-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    border-color: var(--accent-ig);
  }

  .theme-toggle-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
  }

  /* Icon stack: two icons overlaid, cross-fade on theme change */
  .theme-icon-stack {
    position: relative;
    width: 1.3em;
    height: 1.3em;
    display: inline-block;
  }

  .theme-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    line-height: 1;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  /* Default light: show moon */
  html[data-bs-theme="light"] .theme-icon-moon,
  :root[data-bs-theme="light"] .theme-icon-moon {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }
  html[data-bs-theme="light"] .theme-icon-sun,
  :root[data-bs-theme="light"] .theme-icon-sun {
    opacity: 0;
    transform: rotate(90deg) scale(0.4);
  }

  /* Dark: show sun */
  html[data-bs-theme="dark"] .theme-icon-sun,
  :root[data-bs-theme="dark"] .theme-icon-sun {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }
  html[data-bs-theme="dark"] .theme-icon-moon,
  :root[data-bs-theme="dark"] .theme-icon-moon {
    opacity: 0;
    transform: rotate(-90deg) scale(0.4);
  }

  .theme-label {
    font-size: 0.85rem;
    opacity: 0.8;
  }

  /* Dark theme adjustments */
  html[data-bs-theme="dark"] .theme-toggle-btn,
  :root[data-bs-theme="dark"] .theme-toggle-btn {
    background: var(--surface);
    border-color: var(--muted);
    color: var(--text);
  }

  /* Mobile responsive */
  @media (max-width: 1024px) {
    .theme-toggle-btn {
      right: 90px;
    }
  }

  @media (max-width: 768px) {
    .theme-toggle-btn {
      top: 14px;
      right: 14px;
      padding: 0;
      font-size: 0.8rem;
      width: 46px;
      height: 46px;
      justify-content: center;
      gap: 0;
    }

    .theme-icon {
      font-size: 1rem;
    }

    .theme-label {
      display: none; /* 移动端隐藏文字，只显示图标 */
    }

    .theme-toggle-btn {
      border-radius: 50%;
    }
  }

  /* Respect prefers-reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    .theme-icon {
      transition: none;
    }

    .theme-toggle-btn {
      transition: none;
    }

    .theme-toggle-btn:hover {
      transform: none;
    }

    .theme-toggle-btn:active {
      transform: none;
    }
  }
</style>

<script>
  (function () {
    const html = document.documentElement;
    const theme_button = document.getElementById('theme_button');
    const theme_label = theme_button?.querySelector('.theme-label');

    function getPreferredTheme() {
      try {
        const stored = localStorage.getItem('site-theme');
        if (stored) return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (error) {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    }

    function applyTheme(theme) {
      html.setAttribute('data-bs-theme', theme);
      if (theme_label) {
        theme_label.textContent = theme === 'dark' ? 'Dark' : 'Light';
      }
      if (theme_button) {
        theme_button.setAttribute('aria-pressed', String(theme === 'dark'));
      }
      try { localStorage.setItem('site-theme', theme); } catch (e) { /* ignore */ }
    }

    // initialize
    applyTheme(getPreferredTheme());

    theme_button && theme_button.addEventListener('click', () => {
      const isDark = html.getAttribute('data-bs-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark');
    });
  })();
</script>
