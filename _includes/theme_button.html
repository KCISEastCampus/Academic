<button id="theme_button" class="theme-toggle-btn" aria-label="Toggle theme" aria-pressed="false">
  <span class="theme-icon-stack" aria-hidden="true">
    <i class="bi bi-moon theme-icon theme-icon-moon"></i>
    <i class="bi bi-sun theme-icon theme-icon-sun"></i>
  </span>
  <span class="theme-label">Light</span>
</button>

<style>
  .theme-toggle-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 50px;
    border: 2px solid transparent;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    line-height: 1;
    transition: background-color 0.2s ease, border-color 0.2s ease,
      color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    backdrop-filter: blur(10px);
  }

  .theme-toggle-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16);
  }

  .theme-toggle-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
  }

  /* Icon stack: two icons overlaid */
  .theme-icon-stack {
    position: relative;
    width: 1.3em;
    height: 1.3em;
    display: inline-block;
  }

  .theme-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    line-height: 1;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .theme-label {
    font-size: 0.85rem;
    opacity: 0.85;
  }
</style>

<style>
  /* ============================================
     Theme-dependent states (colors set in pairs)
     High specificity + !important to defeat any
     external cascade interference.
     ============================================ */

  /* --- LIGHT MODE --- */
  html[data-bs-theme="light"] .theme-toggle-btn,
  :root[data-bs-theme="light"] .theme-toggle-btn {
    background: #ffffff !important;
    border-color: rgba(15, 23, 42, 0.14) !important;
    color: #0f172a !important;
  }

  html[data-bs-theme="light"] .theme-toggle-btn:hover,
  :root[data-bs-theme="light"] .theme-toggle-btn:hover {
    background: #6b7adb !important;
    border-color: #6b7adb !important;
    color: #ffffff !important;
    box-shadow: 0 4px 20px rgba(107, 122, 219, 0.35) !important;
  }

  html[data-bs-theme="light"] .theme-icon,
  :root[data-bs-theme="light"] .theme-icon {
    color: currentColor !important;
  }

  /* Light: show moon, hide sun */
  html[data-bs-theme="light"] .theme-icon-moon,
  :root[data-bs-theme="light"] .theme-icon-moon {
    opacity: 1 !important;
    transform: rotate(0deg) scale(1) !important;
  }
  html[data-bs-theme="light"] .theme-icon-sun,
  :root[data-bs-theme="light"] .theme-icon-sun {
    opacity: 0 !important;
    transform: rotate(90deg) scale(0.4) !important;
  }

  /* --- DARK MODE --- */
  html[data-bs-theme="dark"] .theme-toggle-btn,
  :root[data-bs-theme="dark"] .theme-toggle-btn {
    background: #1b2638 !important;
    border-color: rgba(255, 255, 255, 0.16) !important;
    color: #e5e7eb !important;
  }

  html[data-bs-theme="dark"] .theme-toggle-btn:hover,
  :root[data-bs-theme="dark"] .theme-toggle-btn:hover {
    background: #6b7adb !important;
    border-color: #6b7adb !important;
    color: #ffffff !important;
    box-shadow: 0 4px 20px rgba(107, 122, 219, 0.4) !important;
  }

  /* Dark: show sun, hide moon */
  html[data-bs-theme="dark"] .theme-icon-sun,
  :root[data-bs-theme="dark"] .theme-icon-sun {
    opacity: 1 !important;
    transform: rotate(0deg) scale(1) !important;
  }
  html[data-bs-theme="dark"] .theme-icon-moon,
  :root[data-bs-theme="dark"] .theme-icon-moon {
    opacity: 0 !important;
    transform: rotate(-90deg) scale(0.4) !important;
  }

  /* Mobile: hide label, circular */
  @media (max-width: 768px) {
    .theme-toggle-btn {
      top: 14px !important;
      right: 14px !important;
      width: 46px;
      height: 46px;
      padding: 0;
      justify-content: center;
      gap: 0;
      border-radius: 50%;
    }
    .theme-icon {
      font-size: 1rem;
    }
    .theme-label {
      display: none !important;
    }
  }

  /* Respect reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    .theme-toggle-btn,
    .theme-icon {
      transition: none !important;
    }
    .theme-toggle-btn:hover {
      transform: none !important;
    }
  }
</style>

<script>
  (function () {
    const html = document.documentElement;
    const theme_button = document.getElementById('theme_button');
    const theme_label = theme_button?.querySelector('.theme-label');

    function getPreferredTheme() {
      try {
        const stored = localStorage.getItem('site-theme');
        if (stored) return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    }

    function applyTheme(theme) {
      html.setAttribute('data-bs-theme', theme);
      if (theme_label) theme_label.textContent = theme === 'dark' ? 'Dark' : 'Light';
      if (theme_button) theme_button.setAttribute('aria-pressed', String(theme === 'dark'));
      try { localStorage.setItem('site-theme', theme); } catch (e) {}
    }

    applyTheme(getPreferredTheme());
    theme_button && theme_button.addEventListener('click', () => {
      const isDark = html.getAttribute('data-bs-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark');
    });

    // Keep the button visible on subject pages (header placement)
    if (theme_button && theme_button.closest('.subject-header-inner')) {
      theme_button.style.position = 'static';
      theme_button.style.top = 'auto';
      theme_button.style.right = 'auto';
    }
  })();
</script>
