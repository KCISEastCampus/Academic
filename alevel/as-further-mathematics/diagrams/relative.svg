<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 655" role="img" aria-labelledby="title desc"><title id="title">Velocity addition and closest point</title><desc id="desc">A velocity triangle has component lengths four and three and resultant five. Relative path at height eight has closest point (0,8).</desc><style>text{font:18px sans-serif;fill:#172b4d}.axis{stroke:#344054;stroke-width:1.5}.curve{fill:none;stroke:#155e75;stroke-width:3}.guide{fill:none;stroke:#8a4711;stroke-width:2;stroke-dasharray:7 5}.other{fill:none;stroke:#7c3aed;stroke-width:2.5}.point{fill:#172b4d}.grid{stroke:#d0d5dd;stroke-width:1}</style><rect width="100%" height="100%" fill="white"/><text x="55" y="25">Velocity triangle: head-to-tail addition</text><path class="axis" d="M55,280 L450,280"/><path class="axis" d="M80,310 L80,45"/><text x="460" y="285">vₓ</text><text x="55" y="45">vᵧ</text><path class="guide" d="M80,280 L360,280"/><path class="guide" d="M360,280 L360,70"/><path class="curve" d="M80,280 L360,70"/><text x="190" y="305">(4,0)</text><text x="370" y="180">(0,3)</text><text x="120" y="145">(4,3), speed 5</text><text x="55" y="345">Relative path: (6−2t,8)</text><path class="axis" d="M73,610 L424,610"/><path class="axis" d="M100,610 L100,367"/><path class="curve" d="M73,394 L424,394"/><path class="other" d="M100,610 L100,394"/><circle class="point" cx="100" cy="394" r="4"/><circle class="point" cx="262" cy="394" r="4"/><text x="110" y="385">nearest (0,8), t=3</text><text x="270" y="425">initial (6,8)</text><text x="440" y="616">x (m)</text><text x="60" y="365">y (m)</text><text x="120" y="645">Same scales: the perpendicular gives 8 m.</text></svg>