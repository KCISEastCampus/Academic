<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="title desc"><title id="title">A shear preserves area</title><desc id="desc">The basis triangle shears to a new triangle; its base and area stay unchanged.</desc><style>text{font:18px sans-serif;fill:#172b4d}.axis{stroke:#344054;stroke-width:1.5}.curve{fill:none;stroke:#155e75;stroke-width:3}.guide{fill:none;stroke:#8a4711;stroke-width:2;stroke-dasharray:7 5}.other{fill:none;stroke:#7c3aed;stroke-width:2.5}.point{fill:#172b4d}.grid{stroke:#d0d5dd;stroke-width:1}</style><rect width="100%" height="100%" fill="white"/><path class="axis" d="M60.00,282.00 L510.00,282.00"/><path class="axis" d="M103.55,322.00 L103.55,42.00"/><text x="516.00" y="287.00">x</text><text x="83.55" y="32.00">y</text><polyline class="curve" points="103.55,282.00 248.71,282.00 103.55,148.67 103.55,282.00"/><polyline class="other" points="103.55,282.00 248.71,282.00 248.71,148.67 103.55,282.00"/><path class="guide" d="M103.55,148.67 L248.71,148.67"/><text x="89.03" y="122.00">(0,1)</text><text x="263.23" y="135.33">(1,1)</text><text x="219.68" y="308.67">(1,0)</text><text x="60.00" y="25.00">Shear: x′=x+y, y′=y</text><text x="60.00" y="350.00">Original and image area = 1/2</text></svg>