<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 560 670" role="img" aria-labelledby="title desc"><title id="title">Discrete probability and step CDF</title><desc id="desc">Equal masses one quarter at integers 1 through 4. The CDF includes each jump value and is right continuous.</desc><style>text{font:26px sans-serif;fill:#172b4d}.axis{stroke:#344054;stroke-width:1.5}.curve{fill:none;stroke:#155e75;stroke-width:3}.guide{fill:none;stroke:#8a4711;stroke-width:2;stroke-dasharray:7 5}.other{fill:none;stroke:#7c3aed;stroke-width:2.5}.point{fill:#172b4d}.grid{stroke:#d0d5dd;stroke-width:1}</style><rect x="0" y="-60" width="560" height="670" fill="white"/><text x="20" y="-20">Uniform on {1,2,3,4}: PMF and CDF</text><path class="axis" d="M60.00,245.00 L510.00,245.00"/><path class="axis" d="M60.00,245.00 L60.00,65.00"/><text x="516.00" y="250.00">x</text><text x="40.00" y="55.00">y</text><path class="curve" d="M150.00,245.00 L150.00,116.43"/><circle class="point" cx="150.00" cy="116.43" r="4"/><text x="141.00" y="265.57">1</text><path class="curve" d="M240.00,245.00 L240.00,116.43"/><circle class="point" cx="240.00" cy="116.43" r="4"/><text x="231.00" y="265.57">2</text><path class="curve" d="M330.00,245.00 L330.00,116.43"/><circle class="point" cx="330.00" cy="116.43" r="4"/><text x="321.00" y="265.57">3</text><path class="curve" d="M420.00,245.00 L420.00,116.43"/><circle class="point" cx="420.00" cy="116.43" r="4"/><text x="411.00" y="265.57">4</text><text x="70.00" y="60.00">P(X=k)</text><text x="70.00" y="105.00">1/4</text><path class="axis" d="M60.00,560.00 L510.00,560.00"/><path class="axis" d="M60.00,560.00 L60.00,340.00"/><text x="516.00" y="565.00">x</text><text x="40.00" y="330.00">y</text><text x="70.00" y="330.00">F(x)</text><path class="curve" d="M60.00,560.00 L150.00,560.00"/><circle class="point" cx="60.00" cy="560.00" r="4"/><circle cx="150.0" cy="560.0" r="4" fill="white" stroke="#172b4d" stroke-width="2"/><path class="curve" d="M150.00,510.00 L240.00