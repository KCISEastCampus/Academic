<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="bisector-title bisector-desc"><title id="bisector-title">Geometry chooses the line equation</title><desc id="bisector-desc">A(1,2) and B(5,4) have midpoint M(3,3). The dashed perpendicular bisector has equation 2x+y−9=0 and passes through M.</desc><rect width="600" height="360" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><style>text{font:18px sans-serif;fill:#172033} .axis{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .curve{stroke:#1d4ed8;stroke-width:3;fill:none} .guide{stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;fill:none} .force{stroke:#334155;stroke-width:3;marker-end:url(#arrow)} .point{fill:#1d4ed8}</style><text x="20" y="28">Geometry chooses the line equation</text><line class="axis" x1="45" y1="310" x2="560" y2="310"/><line class="axis" x1="100" y1="330" x2="100" y2="45"/><text x="552" y="337">x</text><text x="74" y="55">y</text><line class="curve" x1="145" y1="220" x2="325" y2="130"/><line class="guide" x1="172" y1="49" x2="293.5" y2="292"/><circle cx="145" cy="220" r="5" class="point"/><circle cx="325" cy="130" r="5" class="point"/><circle cx="235" cy="175" r="5" class="point"/><text x="107" y="248">A(1,2)</text><text x="335" y="130">B(5,4)</text><text x="245" y="188">M(3,3)</text><text x="316" y="65">2x + y − 9 = 0</text><text x="105" y="347">Midpoint plus perpendicular direction</text></svg>
