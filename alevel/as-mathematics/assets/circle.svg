<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="circle-title circle-desc"><title id="circle-title">A radius and its perpendicular tangent</title><desc id="circle-desc">Circle centre C(2,-1), radius 5, point P(5,3). The tangent is perpendicular to CP; the original x and y axes are labelled.</desc><rect width="600" height="360" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><style>text{font:18px sans-serif;fill:#172033} .axis{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .curve{stroke:#1d4ed8;stroke-width:3;fill:none} .guide{stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;fill:none} .force{stroke:#334155;stroke-width:3;marker-end:url(#arrow)} .point{fill:#1d4ed8}</style><text x="20" y="28">A radius and its perpendicular tangent</text><line class="axis" x1="40" y1="184" x2="550" y2="184"/><line class="axis" x1="226" y1="332" x2="226" y2="50"/><text x="550" y="211">x</text><text x="203" y="58">y</text><circle cx="282" cy="212" r="140" fill="none" stroke="#1d4ed8" stroke-width="3"/><line class="guide" x1="282" y1="212" x2="366" y2="100"/><line class="curve" x1="286" y1="40" x2="498" y2="199"/><circle cx="282" cy="212" r="4" class="point"/><circle cx="366" cy="100" r="4" class="point"/><text x="285" y="238">C(2,-1)</text><text x="371" y="91">P(5,3)</text><text x="450" y="174">tangent</text><text x="294" y="155">r = 5</text></svg>
