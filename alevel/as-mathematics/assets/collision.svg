<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="collision-title collision-desc"><title id="collision-title">Use one positive direction before and after</title><desc id="collision-desc">Right is positive. Before impact A is left and moves right, B is right and moves left. After impact both move right, with B faster than A so the particles separate.</desc><rect width="600" height="360" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><style>text{font:18px sans-serif;fill:#172033} .axis{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .curve{stroke:#1d4ed8;stroke-width:3;fill:none} .guide{stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;fill:none} .force{stroke:#334155;stroke-width:3;marker-end:url(#arrow)} .point{fill:#1d4ed8}</style><text x="20" y="28">Use one positive direction before and after</text><line class="axis" x1="390" y1="65" x2="550" y2="65"/><text x="281" y="72">positive</text><text x="35" y="139">Before</text><circle cx="180" cy="130" r="24" fill="#dbeafe" stroke="#334155"/><circle cx="440" cy="130" r="24" fill="#fef3c7" stroke="#334155"/><text x="173" y="137">A</text><text x="433" y="137">B</text><line class="force" x1="210" y1="130" x2="300" y2="130"/><line class="force" x1="410" y1="130" x2="350" y2="130"/><text x="203" y="108">5 m s⁻¹</text><text x="349" y="168">1 m s⁻¹</text><text x="35" y="265">After</text><circle cx="210" cy="255" r="24" fill="#dbeafe" stroke="#334155"/><circle cx="380" cy="255" r="24" fill="#fef3c7" stroke="#334155"/><text x="203" y="262">A</text><text x="373" y="262">B</text><line class="force" x1="240" y1="255" x2="285" y2="255"/><line class="force" x1="410" y1="255" x2="510" y2="255"/><text x="227" y="300">0.5 m s⁻¹</text><text x="419" y="300">2 m s⁻¹</text></svg>
