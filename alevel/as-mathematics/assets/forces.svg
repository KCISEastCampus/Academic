<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="forces-title forces-desc"><title id="forces-title">Separate force diagrams: hanging masses</title><desc id="forces-desc">A 3 kg mass has tension T upward and weight 3g downward; a 2 kg mass has tension T upward and weight 2g downward. Chosen accelerations are downward on the heavier side and upward on the lighter side.</desc><rect width="600" height="360" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><style>text{font:18px sans-serif;fill:#172033} .axis{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .curve{stroke:#1d4ed8;stroke-width:3;fill:none} .guide{stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;fill:none} .force{stroke:#334155;stroke-width:3;marker-end:url(#arrow)} .point{fill:#1d4ed8}</style><text x="20" y="28">Separate force diagrams: hanging masses</text><rect x="125" y="170" width="90" height="60" fill="#dbeafe" stroke="#334155"/><rect x="385" y="170" width="90" height="60" fill="#dbeafe" stroke="#334155"/><text x="143" y="207">3 kg</text><text x="403" y="207">2 kg</text><line class="force" x1="170" y1="170" x2="170" y2="70"/><line class="force" x1="170" y1="230" x2="170" y2="325"/><line class="force" x1="430" y1="170" x2="430" y2="100"/><line class="force" x1="430" y1="230" x2="430" y2="300"/><text x="181" y="88">T</text><text x="183" y="319">3g</text><text x="441" y="110">T</text><text x="443" y="295">2g</text><line class="force" x1="95" y1="180" x2="95" y2="260"/><text x="66" y="277">a</text><line class="force" x1="510" y1="230" x2="510" y2="150"/><text x="520" y="160">a</text></svg>
