<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="motion-title motion-desc"><title id="motion-title">Vertical flight: velocity and acceleration</title><desc id="motion-desc">Upward is positive. Velocity decreases linearly from 14.7 at t=0 through zero at 1.5 s to -14.7 at 3 s; acceleration is a constant -9.8.</desc><rect width="600" height="360" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><style>text{font:18px sans-serif;fill:#172033} .axis{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .curve{stroke:#1d4ed8;stroke-width:3;fill:none} .guide{stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;fill:none} .force{stroke:#334155;stroke-width:3;marker-end:url(#arrow)} .point{fill:#1d4ed8}</style><text x="20" y="28">Vertical flight: velocity and acceleration</text><line class="axis" x1="55" y1="190" x2="550" y2="190"/><line class="axis" x1="80" y1="315" x2="80" y2="55"/><text x="539" y="218">t / s</text><text x="91" y="62">v / (m s⁻¹)</text><line class="curve" x1="80" y1="90" x2="500" y2="290"/><text x="13" y="92">14.7</text><text x="6" y="295">−14.7</text><text x="272" y="218">1.5</text><text x="490" y="218">3</text><text x="320" y="75">a = −9.8 m s⁻²</text><line class="guide" x1="500" y1="290" x2="500" y2="190"/></svg>
