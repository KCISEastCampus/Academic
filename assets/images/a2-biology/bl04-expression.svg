<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 565" role="img" aria-labelledby="expression-title expression-desc"><title id="expression-title">Gene expression control at different levels</title><desc id="expression-desc">DNA in chromatin is transcribed to mRNA and mRNA is translated to protein. DNA methylation and histone acetylation regulate access for transcription. Small RNAs act on mRNA, affecting its stability or translation. No step changes the target DNA base sequence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#233c50"/></marker></defs><rect width="760" height="565" fill="#fff"/><g font-family="Arial, sans-serif" font-size="21" fill="#162e40" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="35" font-size="26">Control at different information stages</text><rect x="405" y="80" width="320" height="65" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="430" y="109" font-size="23">DNA in chromatin</text><text x="430" y="134" font-size="18">base sequence retained</text><line x1="565" y1="149" x2="565" y2="241" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="581" y="201" font-size="18">Transcription</text><rect x="20" y="155" width="335" height="105" rx="10" fill="#fff8ed" stroke="#436477" stroke-width="2"/><text x="39" y="184" font-size="21">DNA methylation</text><text x="39" y="212" font-size="21">Histone acetylation</text><text x="39" y="241" font-size="20">→ accessibility of DNA</text><line x1="360" y1="202" x2="542" y2="202" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="250" width="320" height="65" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="430" y="289" font-size="25">mRNA</text><rect x="20" y="330" width="335" height="112" rx="10" fill="#e6f2ed" stroke="#436477" stroke-width="2"/><text x="39" y="359" font-size="21">Small RNA + complex</text><text x="39" y="388" font-size="20">→ mRNA stability</text><text x="39" y="417" font-size="20">or translation</text><line x1="358" y1="370" x2="434" y2="315" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><line x1="565" y1="319" x2="565" y2="437" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="581" y="380" font-size="18">Translation</text><rect x="405" y="447" width="320" height="65" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="430" y="488" font-size="25">Protein</text><text x="24" y="546" font-size="19">Gene regulation changes output; it need not change the DNA sequence.</text></g></svg>
