<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 805" role="img" aria-labelledby="feedback-heart-title feedback-heart-desc"><title id="feedback-heart-title">Blood glucose feedback and cardiac conduction</title><desc id="feedback-heart-desc">Two separate negative-feedback chains show increased blood glucose, beta-cell insulin and uptake or storage; and decreased blood glucose, alpha-cell glucagon and liver glucose output. Each final response opposes the initial deviation. A separate vertical sequence shows SAN and atria, AVN delay, bundle of His, Purkinje tissue and ventricular contraction from apex upwards.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#233c50"/></marker></defs><rect width="760" height="805" fill="#fff"/><g font-family="Arial, sans-serif" font-size="21" fill="#162e40" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="35" font-size="26">Two glucose corrections</text><rect x="25" y="65" width="335" height="60" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="45" y="103" font-size="23">Blood glucose rises</text><rect x="400" y="65" width="335" height="60" rx="10" fill="#fff8ed" stroke="#436477" stroke-width="2"/><text x="420" y="103" font-size="23">Blood glucose falls</text><line x1="190" y1="128" x2="190" y2="162" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><line x1="566" y1="128" x2="566" y2="162" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="170" width="335" height="62" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="44" y="196" font-size="21">Pancreatic β cells</text><text x="44" y="221" font-size="21">→ insulin secretion</text><rect x="400" y="170" width="335" height="62" rx="10" fill="#fff8ed" stroke="#436477" stroke-width="2"/><text x="418" y="196" font-size="21">Pancreatic α cells</text><text x="418" y="221" font-size="21">→ glucagon secretion</text><line x1="190" y1="234" x2="190" y2="267" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><line x1="566" y1="234" x2="566" y2="267" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="275" width="335" height="85" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="42" y="302" font-size="21">Muscle/adipose uptake</text><text x="42" y="330" font-size="21">Liver storage increases</text><rect x="400" y="275" width="335" height="85" rx="10" fill="#fff8ed" stroke="#436477" stroke-width="2"/><text x="416" y="302" font-size="20">Liver glycogen breakdown</text><text x="416" y="330" font-size="20">and gluconeogenesis</text><line x1="190" y1="364" x2="190" y2="391" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><line x1="566" y1="364" x2="566" y2="391" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="54" y="420" font-size="20">Glucose falls towards range</text><text x="426" y="420" font-size="20">Glucose rises towards range</text><text x="67" y="450" font-size="19">Less secretion stimulus</text><text x="438" y="450" font-size="19">Less secretion stimulus</text><line x1="25" y1="477" x2="735" y2="477" stroke="#bdccd5" stroke-width="2"/><text x="24" y="514" font-size="24">Heart: electrical sequence (not blood flow)</text><rect x="90" y="540" width="580" height="48" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="111" y="571" font-size="21">SAN → wave through atria → atrial systole</text><line x1="380" y1="590" x2="380" y2="607" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="615" width="580" height="48" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="112" y="646" font-size="21">AVN delay → bundle of His towards apex</text><line x1="380" y1="665" x2="380" y2="682" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="690" width="580" height="62" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="112" y="716" font-size="21">Purkinje tissue → ventricular excitation</text><text x="112" y="742" font-size="21">→ contraction from apex upwards</text><text x="24" y="786" font-size="19">Autonomic nerves adjust SAN rate; the rhythm starts in the heart.</text></g></svg>
