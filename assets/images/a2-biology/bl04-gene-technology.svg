<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="gene-technology-title gene-technology-desc"><title id="gene-technology-title">PCR direction and stages of recombinant DNA evidence</title><desc id="gene-technology-desc">The upper template runs 3-prime to 5-prime from left to right with a forward primer extending rightwards; the lower template runs 5-prime to 3-prime with a reverse primer extending leftwards. The lower panel separates compatible DNA joining, transformation, selection or screening, DNA verification and expression or function testing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#233c50"/></marker></defs><rect width="760" height="620" fill="#fff"/><g font-family="Arial, sans-serif" font-size="21" fill="#162e40" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="35" font-size="25">PCR: opposite templates, inward extension</text><text x="30" y="93" font-size="22">3′</text><line x1="70" y1="86" x2="687" y2="86" stroke="#436477" stroke-width="4"/><text x="705" y="93" font-size="22">5′</text><line x1="145" y1="117" x2="235" y2="117" stroke="#956b30" stroke-width="8"/><line x1="238" y1="117" x2="430" y2="117" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="141" y="151" font-size="20">5′ primer 3′ → new DNA</text><text x="30" y="204" font-size="22">5′</text><line x1="70" y1="197" x2="687" y2="197" stroke="#436477" stroke-width="4"/><text x="705" y="204" font-size="22">3′</text><line x1="525" y1="168" x2="615" y2="168" stroke="#377b65" stroke-width="8"/><line x1="521" y1="168" x2="330" y2="168" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="238" font-size="20">new DNA ← 3′ primer 5′</text><text x="24" y="279" font-size="20">New strands extend 5′ → 3′ from each primer's 3′ end.</text><line x1="25" y1="301" x2="735" y2="301" stroke="#bdccd5" stroke-width="2"/><text x="24" y="338" font-size="25">Different stages need different evidence</text><rect x="60" y="357" width="640" height="46" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="80" y="387" font-size="21">Compatible insert + vector → ligase seals backbone</text><line x1="380" y1="405" x2="380" y2="421" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="429" width="640" height="46" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="80" y="459" font-size="21">Transformation → select / screen candidate cells</text><line x1="380" y1="477" x2="380" y2="493" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="501" width="640" height="46" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="80" y="531" font-size="21">Verify DNA identity, orientation and reading frame</text><line x1="380" y1="549" x2="380" y2="565" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="594" font-size="22">Then test target protein expression AND function</text></g></svg>
