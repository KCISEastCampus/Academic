<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="iaa-data-title iaa-data-desc"><title id="iaa-data-title">IAA concentration and shoot elongation</title><desc id="iaa-data-desc">Adapted teaching plot of OxfordAQA 9610 BL04 June 2025 question 4 data. Zero added IAA is shown separately as 1.4 mm. Positive concentrations 0.01, 0.10, 1.00 and 10.00 milligrams per cubic decimetre are plotted on a log axis, with mean elongations 1.6, 2.3, 5.4 and 6.9 mm. No uncertainty values were supplied.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#233c50"/></marker></defs><rect width="760" height="540" fill="#fff"/><g font-family="Arial, sans-serif" font-size="21" fill="#162e40" stroke-linecap="round" stroke-linejoin="round"><text x="22" y="34" font-size="26">IAA and mean shoot-tip elongation</text><text x="22" y="66" font-size="18">Adapted: 9610 BL04 • May/June 2025 • Q4</text><text x="22" y="99" font-size="20">Mean increase after 48 h / mm</text><line x1="65" y1="410" x2="704" y2="410" stroke="#dce5eb" stroke-width="1"/><text x="37" y="417" font-size="18">0</text><line x1="65" y1="340" x2="704" y2="340" stroke="#dce5eb" stroke-width="1"/><text x="37" y="347" font-size="18">2</text><line x1="65" y1="270" x2="704" y2="270" stroke="#dce5eb" stroke-width="1"/><text x="37" y="277" font-size="18">4</text><line x1="65" y1="200" x2="704" y2="200" stroke="#dce5eb" stroke-width="1"/><text x="37" y="207" font-size="18">6</text><line x1="65" y1="130" x2="704" y2="130" stroke="#dce5eb" stroke-width="1"/><text x="37" y="137" font-size="18">8</text><line x1="65" y1="130" x2="65" y2="410" stroke="#233c50" stroke-width="3"/><line x1="235" y1="410" x2="704" y2="410" stroke="#233c50" stroke-width="3"/><line x1="198" y1="125" x2="198" y2="455" stroke="#647b8a" stroke-width="2" stroke-dasharray="6 6"/><circle cx="120" cy="361" r="7" fill="#956b30"/><text x="90" y="347" font-size="20">1.4</text><text x="95" y="440" font-size="18">0.00</text><text x="78" y="469" font-size="18">Control</text><polyline points="260,354 390,329.5 520,221 650,168.5" fill="none" stroke="#276e7d" stroke-width="3"/><circle cx="260" cy="354" r="6" fill="#276e7d"/><text x="245" y="341" font-size="18">1.6</text><circle cx="390" cy="329.5" r="6" fill="#276e7d"/><text x="375" y="316.5" font-size="18">2.3</text><circle cx="520" cy="221" r="6" fill="#276e7d"/><text x="505" y="208" font-size="18">5.4</text><circle cx="650" cy="168.5" r="6" fill="#276e7d"/><text x="635" y="155.5" font-size="18">6.9</text><text x="240" y="440" font-size="18">0.01</text><text x="370" y="440" font-size="18">0.10</text><text x="500" y="440" font-size="18">1.00</text><text x="630" y="440" font-size="18">10.00</text><text x="238" y="469" font-size="20">IAA / mg dm⁻³ — logarithmic scale</text><text x="22" y="506" font-size="18">Zero is separate: log(0) is undefined. Segments only guide the eye.</text></g></svg>
