<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" aria-labelledby="iaa-direction-title iaa-direction-desc"><title id="iaa-direction-title">Unequal elongation explains bending</title><desc id="iaa-direction-desc">The upper panel is a worked shoot example in darkness: gravity acts down, IAA is greater on the lower side, the lower side elongates more and the shoot bends up. The separate root exercise supplies only the initial lower-side IAA distribution; elongation and curvature remain blank.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#233c50"/></marker></defs><rect width="760" height="530" fill="#fff"/><g font-family="Arial, sans-serif" font-size="21" fill="#162e40" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="35" font-size="26">IAA, relative elongation and direction</text><text x="24" y="68" font-size="18">Darkness • young organs • schematic, not to scale</text><rect x="20" y="92" width="720" height="195" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="38" y="125" font-size="23">SHOOT — worked example</text><line x1="675" y1="135" x2="675" y2="210" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="616" y="242" font-size="18">Gravity</text><path d="M50 160 H230 M50 194 H230" fill="none" stroke="#377b65" stroke-width="8"/><text x="58" y="150" font-size="17">upper side</text><text x="55" y="225" font-size="18">lower side: more IAA</text><line x1="255" y1="178" x2="320" y2="178" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="165" font-size="20">Lower side</text><text x="340" y="193" font-size="20">elongates more</text><path d="M515 207 Q578 207 578 135 M515 226 Q604 226 604 135" fill="none" stroke="#377b65" stroke-width="6"/><text x="38" y="266" font-size="19">Longer lower side lies on the outside → curvature upwards</text><rect x="20" y="310" width="720" height="195" rx="10" fill="#fff8ed" stroke="#436477" stroke-width="2"/><text x="38" y="343" font-size="23">ROOT — complete P1</text><path d="M50 375 H230 M50 407 H230" fill="none" stroke="#956b30" stroke-width="7"/><text x="50" y="441" font-size="18">lower side: more IAA</text><line x1="255" y1="392" x2="315" y2="392" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="385" font-size="20">Relative elongation: ______</text><text x="337" y="425" font-size="20">Curvature: ______</text><text x="38" y="478" font-size="18">Use the stated root response; do not copy the shoot response.</text></g></svg>
