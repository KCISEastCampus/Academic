<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="receptors-title receptors-desc"><title id="receptors-title">Pacinian structure and retinal wiring</title><desc id="receptors-desc">A layered capsule surrounds a sensory nerve ending. Pressure deforms a mechanically gated sodium channel allowing sodium entry. A separate schematic compares three receptor inputs converging on one output with three separately maintained pathways.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#233c50"/></marker></defs><rect width="760" height="550" fill="#fff"/><g font-family="Arial, sans-serif" font-size="21" fill="#162e40" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="34" font-size="26">Receptor structure and connections</text><text x="24" y="73" font-size="21">Pacinian corpuscle: pressure → deformation</text><ellipse cx="190" cy="165" rx="145" ry="67" fill="none" stroke="#59768a" stroke-width="3"/><ellipse cx="190" cy="165" rx="115" ry="50" fill="none" stroke="#59768a" stroke-width="3"/><ellipse cx="190" cy="165" rx="85" ry="33" fill="none" stroke="#59768a" stroke-width="3"/><line x1="150" y1="164" x2="390" y2="164" stroke="#956b30" stroke-width="8"/><line x1="190" y1="80" x2="190" y2="120" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="395" y="169" font-size="20">sensory ending</text><text x="30" y="263" font-size="19">concentric capsule layers</text><rect x="440" y="195" width="290" height="85" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="457" y="225" font-size="19">Na⁺ enters open channel</text><text x="457" y="253" font-size="19">→ generator potential</text><line x1="343" y1="206" x2="425" y2="229" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="24" y="315" font-size="22">Retina: simplified information pathways</text><text x="55" y="350" font-size="20">Convergence</text><text x="430" y="350" font-size="20">Separate channels</text><circle cx="80" cy="385" r="16" fill="#e6f2ed" stroke="#377b65" stroke-width="2"/><line x1="80" y1="403" x2="180" y2="447" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><circle cx="180" cy="385" r="16" fill="#e6f2ed" stroke="#377b65" stroke-width="2"/><line x1="180" y1="403" x2="180" y2="447" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><circle cx="280" cy="385" r="16" fill="#e6f2ed" stroke="#377b65" stroke-width="2"/><line x1="280" y1="403" x2="180" y2="447" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="126" y="460" width="110" height="38" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="144" y="486" font-size="19">output</text><circle cx="440" cy="385" r="16" fill="#edf5fa" stroke="#436477" stroke-width="2"/><line x1="440" y1="403" x2="440" y2="447" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="406" y="460" width="68" height="38" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="417" y="486" font-size="19">out</text><circle cx="540" cy="385" r="16" fill="#edf5fa" stroke="#436477" stroke-width="2"/><line x1="540" y1="403" x2="540" y2="447" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="506" y="460" width="68" height="38" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="517" y="486" font-size="19">out</text><circle cx="640" cy="385" r="16" fill="#edf5fa" stroke="#436477" stroke-width="2"/><line x1="640" y1="403" x2="640" y2="447" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="606" y="460" width="68" height="38" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="617" y="486" font-size="19">out</text><text x="24" y="534" font-size="18">Arrows show signal direction. Real retinal networks are more complex.</text></g></svg>
