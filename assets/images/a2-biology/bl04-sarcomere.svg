<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="sarcomere-title sarcomere-desc"><title id="sarcomere-title">Sarcomere sliding without filament shortening</title><desc id="sarcomere-desc">Two schematic sarcomeres show the same thick and thin filament lengths. In the lower shorter sarcomere the Z lines are closer, the overlap is greater, the A band is unchanged and the I-band portions and H zone are narrower.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#233c50"/></marker></defs><rect width="760" height="550" fill="#fff"/><g font-family="Arial, sans-serif" font-size="21" fill="#162e40" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="34" font-size="26">Sarcomeres: sliding changes overlap</text><text x="24" y="68" font-size="18">Thin actin = fine lines • Thick myosin = heavy line</text><text x="24" y="95" font-size="22">Longer</text><line x1="100" y1="130" x2="100" y2="190" stroke="#233c50" stroke-width="5"/><line x1="660" y1="130" x2="660" y2="190" stroke="#233c50" stroke-width="5"/><line x1="100" y1="146" x2="300" y2="146" stroke="#377b65" stroke-width="4"/><line x1="100" y1="174" x2="300" y2="174" stroke="#377b65" stroke-width="4"/><line x1="460" y1="146" x2="660" y2="146" stroke="#377b65" stroke-width="4"/><line x1="460" y1="174" x2="660" y2="174" stroke="#377b65" stroke-width="4"/><line x1="250" y1="160" x2="510" y2="160" stroke="#956b30" stroke-width="13"/><text x="92" y="216" font-size="19">Z</text><text x="652" y="216" font-size="19">Z</text><line x1="250" y1="115" x2="510" y2="115" stroke="#233c50" stroke-width="3"/><line x1="250" y1="108" x2="250" y2="122" stroke="#233c50" stroke-width="3"/><line x1="510" y1="108" x2="510" y2="122" stroke="#233c50" stroke-width="3"/><text x="303" y="105" font-size="19">A band: fixed</text><line x1="300" y1="235" x2="460" y2="235" stroke="#233c50" stroke-width="3"/><line x1="300" y1="228" x2="300" y2="242" stroke="#233c50" stroke-width="3"/><line x1="460" y1="228" x2="460" y2="242" stroke="#233c50" stroke-width="3"/><text x="350" y="261" font-size="18">H zone</text><line x1="100" y1="198" x2="250" y2="198" stroke="#233c50" stroke-width="3"/><text x="171" y="221" font-size="18">I</text><line x1="510" y1="198" x2="660" y2="198" stroke="#233c50" stroke-width="3"/><text x="581" y="221" font-size="18">I</text><text x="24" y="315" font-size="22">Shorter</text><line x1="160" y1="350" x2="160" y2="410" stroke="#233c50" stroke-width="5"/><line x1="600" y1="350" x2="600" y2="410" stroke="#233c50" stroke-width="5"/><line x1="160" y1="366" x2="360" y2="366" stroke="#377b65" stroke-width="4"/><line x1="160" y1="394" x2="360" y2="394" stroke="#377b65" stroke-width="4"/><line x1="400" y1="366" x2="600" y2="366" stroke="#377b65" stroke-width="4"/><line x1="400" y1="394" x2="600" y2="394" stroke="#377b65" stroke-width="4"/><line x1="250" y1="380" x2="510" y2="380" stroke="#956b30" stroke-width="13"/><text x="152" y="436" font-size="19">Z</text><text x="592" y="436" font-size="19">Z</text><line x1="250" y1="335" x2="510" y2="335" stroke="#233c50" stroke-width="3"/><line x1="250" y1="328" x2="250" y2="342" stroke="#233c50" stroke-width="3"/><line x1="510" y1="328" x2="510" y2="342" stroke="#233c50" stroke-width="3"/><text x="303" y="325" font-size="19">A band: fixed</text><line x1="360" y1="455" x2="400" y2="455" stroke="#233c50" stroke-width="3"/><line x1="360" y1="448" x2="360" y2="462" stroke="#233c50" stroke-width="3"/><line x1="400" y1="448" x2="400" y2="462" stroke="#233c50" stroke-width="3"/><text x="350" y="481" font-size="18">H zone</text><line x1="160" y1="418" x2="250" y2="418" stroke="#233c50" stroke-width="3"/><text x="201" y="441" font-size="18">I</text><line x1="510" y1="418" x2="600" y2="418" stroke="#233c50" stroke-width="3"/><text x="551" y="441" font-size="18">I</text><line x1="180" y1="301" x2="220" y2="301" stroke="#233c50" stroke-width="3" marker-