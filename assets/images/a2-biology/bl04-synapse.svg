<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img" aria-labelledby="synapse-title synapse-desc"><title id="synapse-title">One-way cholinergic synaptic transmission</title><desc id="synapse-desc">An action potential arrives at a presynaptic terminal. Calcium enters and triggers vesicle fusion and acetylcholine release. Acetylcholine diffuses to postsynaptic receptors. Acetylcholinesterase breaks it down; choline is taken back into the terminal.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#233c50"/></marker></defs><rect width="760" height="570" fill="#fff"/><g font-family="Arial, sans-serif" font-size="21" fill="#162e40" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="35" font-size="26">Cholinergic synapse</text><rect x="45" y="80" width="440" height="200" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="65" y="112" font-size="22">Presynaptic terminal</text><line x1="85" y1="40" x2="85" y2="77" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="114" y="64" font-size="18">Action potential</text><circle cx="185" cy="170" r="27" fill="#fff8ed" stroke="#956b30" stroke-width="3"/><circle cx="185" cy="170" r="7" fill="#956b30"/><text x="66" y="220" font-size="19">ACh vesicle</text><line x1="208" y1="191" x2="263" y2="256" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="508" y="130" font-size="20">Ca²⁺ outside</text><line x1="570" y1="149" x2="477" y2="178" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="506" y="207" font-size="19">Ca²⁺ entry</text><text x="506" y="237" font-size="19">triggers fusion</text><path d="M250 280 Q250 235 280 235 Q310 235 310 280" fill="#fff8ed" stroke="#956b30" stroke-width="3"/><circle cx="280" cy="290" r="5" fill="#956b30"/><circle cx="280" cy="320" r="5" fill="#956b30"/><circle cx="280" cy="350" r="5" fill="#956b30"/><line x1="304" y1="296" x2="304" y2="386" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="337" font-size="21">Synaptic cleft</text><text x="335" y="345" font-size="19">ACh diffusion</text><rect x="45" y="405" width="440" height="105" rx="10" fill="#edf5fa" stroke="#436477" stroke-width="2"/><text x="66" y="483" font-size="20">Postsynaptic membrane / cell</text><path d="M260 425 V395 H285 V425 M320 425 V395 H345 V425" fill="none" stroke="#276e7d" stroke-width="6"/><text x="480" y="393" font-size="19">ACh receptors</text><line x1="470" y1="399" x2="351" y2="406" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="285" width="245" height="65" rx="10" fill="#fff8ed" stroke="#436477" stroke-width="2"/><text x="503" y="312" font-size="18">Acetylcholinesterase</text><text x="503" y="336" font-size="18">breaks down ACh</text><path d="M720 280 V260 Q720 250 710 250 H488" fill="none" stroke="#233c50" stroke-width="3" marker-end="url(#arrow)"/><text x="535" y="275" font-size="17">Choline uptake</text><text x="24" y="551" font-size="18">Schematic, not to scale; calcium entry and transmitter movement differ.</text></g></svg>
