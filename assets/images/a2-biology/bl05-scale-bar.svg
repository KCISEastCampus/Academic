<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="title desc">
  <title id="title">Cell-length measurement using an embedded scale bar</title>
  <desc id="desc">A schematic cell extends from A to B along a horizontal measured axis. The length bracket spans 300 drawing units. The scale bar spans 100 drawing units and represents 20 micrometres. The image is a worked teaching example, not a micrograph.</desc>
  <rect width="520" height="330" rx="12" fill="#fffdf7"/>
  <g font-family="Arial, sans-serif" fill="#172c35" text-anchor="middle">
    <text x="260" y="34" font-size="21" font-weight="bold">Measure object and bar in the same image</text>
    <text x="260" y="59" font-size="16">Original schematic · worked example</text>
    <path d="M90 156C90 108 390 108 390 156C390 204 90 204 90 156Z" fill="#dfeee4" stroke="#256443" stroke-width="3"/>
    <ellipse cx="235" cy="155" rx="24" ry="17" fill="#c6d4e9" stroke="#345781" stroke-width="2"/>
    <path d="M90 98H390M90 89v18M390 89v18" fill="none" stroke="#172c35" stroke-width="2"/>
    <text x="90" y="83" font-size="18">A</text>
    <text x="390" y="83" font-size="18">B</text>
    <path d="M90 113v91M390 113v91" stroke="#56656d" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M90 244H190M90 237v14M190 237v14" stroke="#172c35" stroke-width="4"/>
    <text x="140" y="278" font-size="21">20 µm</text>
    <text x="260" y="312" font-size="16">Resize the whole image; keep the object-to-bar ratio.</text>
  </g>
</svg>
