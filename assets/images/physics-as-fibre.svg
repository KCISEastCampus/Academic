<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Step-index fibre ray model</title><desc id="d">A core of index n core lies between lower-index cladding. A ray zigzags along the core; incidence i is measured to a vertical normal at the upper boundary.</desc><rect width="760" height="320" fill="white"/><path d="M30 40H730V105H30ZM30 215H730V280H30Z" fill="#e2e8f0" stroke="#334155"/><path d="M30 105H730V215H30Z" fill="#eff6ff" stroke="#334155"/><path d="M50 205L270 105L512 215L732 115" fill="none" stroke="#b45309" stroke-width="4"/><path d="M270 65V160" stroke="#334155" stroke-dasharray="5 4"/><path d="M270 145A40 40 0 0 1 234 122" fill="none" stroke="#334155"/><g font-family="sans-serif" font-size="18" fill="#172b4d"><text x="55" y="76">Cladding: n cladding</text><text x="380" y="162">Core: n core &gt; n cladding</text><text x="55" y="256">Cladding</text><text x="245" y="151">i</text><text x="285" y="82">normal</text><text x="55" y="308">Guided ray; schematic, angles not to scale</text></g></svg>
