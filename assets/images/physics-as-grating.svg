<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 350" role="img" aria-labelledby="t d"><title id="t">Grating path difference</title><desc id="d">Adjacent slits A and B are separated vertically by d. Outgoing rays are parallel at theta above the rightward normal. A perpendicular from B meets the ray from A at C; AC equals d sin theta.</desc><rect width="740" height="350" fill="white"/><g stroke="#334155" stroke-width="2" fill="none"><path d="M180 35V300M180 250H590" stroke-dasharray="6 4"/><path d="M180 250L620 30M180 130L380 30" stroke="#0369a1" stroke-width="3"/><path d="M180 130L228 226" stroke="#b45309" stroke-dasharray="5 3"/><path d="M214 233L207 219L221 212"/><path d="M145 130V250M137 130H153M137 250H153"/><path d="M250 250A70 70 0 0 0 242.61 218.7"/></g><g fill="#172b4d" font-family="sans-serif" font-size="18"><text x="165" y="275">A</text><text x="156" y="122">B</text><text x="237" y="235">C</text><text x="115" y="195">d</text><text x="260" y="239">θ</text><text x="470" y="277">normal</text><text x="300" y="305">AC = d sin θ</text><text x="360" y="112">parallel outgoing rays</text><text x="30" y="325">Normal incidence; schematic geometry</text></g></svg>
