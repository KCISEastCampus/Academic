<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340" role="img" aria-labelledby="title desc">
  <title id="title">An angled pull on a rough horizontal plane</title>
  <desc id="desc">The particle's weight is 100 newtons downwards. A 40 newton tension pulls right at 30 degrees above horizontal. Normal reaction acts upwards and limiting friction acts left.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
  <rect width="400" height="340" rx="8" fill="white"/>
  <path d="M35 220H365" fill="none" stroke="#8b98a6" stroke-width="2"/>
  <path d="M45 230L55 220M85 230L95 220M125 230L135 220M265 230L275 220M305 230L315 220M345 230L355 220" stroke="#8b98a6"/>
  <rect x="180" y="180" width="40" height="40" fill="#d9eee5" stroke="#8b98a6"/>
  <path d="M220 200H345M250 200A50 50 0 0 0 243.3 175" fill="none" stroke="#8b98a6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g stroke="#172033" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M200 200V55"/><path d="M200 200V310"/><path d="M200 200H55"/><path d="M200 200L330 124.94"/>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="21">
    <text x="213" y="82">R</text><text x="212" y="295">100 N</text>
    <text x="69" y="185">F</text><text x="276" y="112">T = 40 N</text>
    <text x="258" y="186">30°</text>
  </g>
</svg>
