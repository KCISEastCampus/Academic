<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340" role="img" aria-labelledby="title desc">
<title id="title">Horizontal motion inside a smooth bowl</title><desc id="desc">The vertical section of a hemisphere has centre O and radius a. Particle P is below and right of O. Its horizontal circle has centre C, radius r and depth d below O. Normal reaction R points up and left towards O; weight mg points vertically down. The right triangle OCP distinguishes a from r.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
<rect width="400" height="340" rx="8" fill="white"/>
<path d="M45 100A150 150 0 0 0 345 100" fill="none" stroke="#527568" stroke-width="3"/>
<path d="M45 100H345M195 100V190H315M195 100L315 190" fill="none" stroke="#8494a6" stroke-dasharray="5 4"/>
<ellipse cx="195" cy="190" rx="120" ry="24" fill="none" stroke="#8494a6" stroke-dasharray="5 4"/>
<path d="M195 175H210V190" fill="none" stroke="#8494a6"/>
<g fill="none" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"><path d="M315 190L245 137.5"/><path d="M315 190V283"/></g>
<circle cx="195" cy="100" r="3" fill="#172033"/><circle cx="315" cy="190" r="6" fill="#b54720"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#172033"><text x="69" y="32">Vertical section of a smooth bowl</text><text x="177" y="88">O</text><text x="175" y="207">C</text><text x="327" y="194">P</text><text x="244" y="124">a</text><text x="250" y="226">r</text><text x="169" y="151">d</text><text x="218" y="139">R</text><text x="327" y="273">mg</text><text x="111" y="319">r² + d² = a²</text></g>
</svg>
