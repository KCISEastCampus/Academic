<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340" role="img" aria-labelledby="title desc">
<title id="title">Circular motion with a raised string attachment</title><desc id="desc">In a vertical section, fixed point A is height h above a smooth horizontal plane. Particle P moves in a horizontal circle of radius r about O directly below A. The string length is l. On P, tension points towards A, normal reaction acts up and weight acts down. Lifting off occurs when the normal reaction becomes zero.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
<rect width="400" height="340" rx="8" fill="white"/>
<path d="M30 232H375" stroke="#8494a6" stroke-width="2"/><path d="M125 88V232H317" stroke="#8494a6" fill="none" stroke-dasharray="5 4"/><path d="M125 88L317 232" stroke="#527568" stroke-width="3"/>
<path d="M125 217H140V232" fill="none" stroke="#8494a6"/>
<g fill="none" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"><path d="M317 232L244 177.25"/><path d="M317 232V137"/><path d="M317 232V292"/></g>
<circle cx="125" cy="88" r="3" fill="#172033"/><circle cx="317" cy="232" r="6" fill="#b54720"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#172033"><text x="200" y="32" text-anchor="middle">String fixed above the plane</text><text x="107" y="77">A</text><text x="105" y="252">O</text><text x="330" y="238">P</text><text x="102" y="163">h</text><text x="197" y="140">l</text><text x="219" y="257">r</text><text x="225" y="195">T</text><text x="330" y="143">R</text><text x="330" y="291">mg</text><text x="86" y="326">At lifting off: R = 0</text></g>
</svg>
