<svg xmlns="http://www.w3.org/2000/svg" width="400" height="380" viewBox="0 0 400 380" role="img" aria-labelledby="title desc">
<title id="title">A rectangle with a triangular top</title><desc id="desc">The rectangle extends from zero to four across and zero to two upwards. The triangle reaches height five. The centres are (2,1) and (2,3); the combined centre is (2,13/7). All lengths are in centimetres.</desc>
<rect width="400" height="380" rx="8" fill="white"/>
<path d="M80 310H320V190H80Z" fill="#e4f1ed" stroke="#172033" stroke-width="2"/>
<path d="M80 190L200 40L320 190Z" fill="#e5edf8" stroke="#172033" stroke-width="2"/>
<path d="M200 40V310" stroke="#8494a6" stroke-dasharray="6 5"/>
<g fill="#172033" font-family="Arial,sans-serif" font-size="20"><text x="43" y="334">(0,0)</text><text x="280" y="334">(4,0)</text><text x="9" y="185">(0,2)</text><text x="323" y="185">(4,2)</text><text x="212" y="40">(2,5)</text><text x="218" y="255">(2,1)</text><text x="218" y="155">(2,3)</text><text x="28" y="224">G</text><text x="126" y="365">Lengths in cm</text></g>
<g fill="#172033"><circle cx="200" cy="250" r="4"/><circle cx="200" cy="150" r="4"/></g>
