<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340" role="img" aria-labelledby="title desc">
<title id="title">Energy on a fixed smooth circular wire</title><desc id="desc">A bead is threaded on a smooth circular wire of radius one metre. It starts at the lowest point A with velocity tangent to the wire. At B it first stops, at vertical height h above A and above the centre O. At this turning point above O, the normal reaction points outwards, perpendicular to the circular path. Weight acts vertically downwards.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
<rect width="400" height="340" rx="8" fill="white"/>
<circle cx="190" cy="159" r="100" stroke="#527568" stroke-width="3" fill="none"/>
<path d="M190 159V259M190 159L287.435 136.5" stroke="#8494a6" stroke-dasharray="5 4"/>
<path d="M65 259H373M287.435 136.5H373" stroke="#8494a6" stroke-dasharray="5 4"/>
<g fill="none" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"><path d="M190 259H274"/><path d="M287.435 136.5L346 122.976"/><path d="M287.435 136.5V219"/><path d="M356 259V136.5"/></g>
<circle cx="190" cy="259" r="6" fill="#b54720"/><circle cx="287.435" cy="136.5" r="6" fill="#b54720"/><circle cx="190" cy="159" r="3" fill="#172033"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#172033"><text x="24" y="32">Threaded bead; fixed smooth wire</text><text x="165" y="284">A</text><text x="296" y="126">B</text><text x="167" y="154">O</text><text x="144" y="214">1 m</text><text x="337" y="110">R</text><text x="299" y="201">mg</text><text x="368" y="203">h</text><text x="219" y="284">4.9 m/s</text><text x="104" y="323">At B: speed = 0</text></g>
</svg>
