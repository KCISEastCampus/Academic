<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
<title id="title">Connected particles and forces on the pulley</title><desc id="desc">A four kilogram particle on a rough thirty-degree slope is joined over a pulley to a hanging three kilogram particle. On A tension acts up the plane, friction down, reaction normally out and weight vertically down. B has upward tension and downward weight. The pulley feels two equal tensions directed down-left and vertically down, separated by sixty degrees.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
<rect width="400" height="640" rx="8" fill="white"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#172033">
<text x="25" y="29">A moves up; B moves down</text>
<path d="M25 230L275 86M25 230H95" stroke="#8494a6" stroke-width="2" fill="none"/>
<path d="M135 166L270 88A12 12 0 0 1 288 98V180" stroke="#527568" fill="none" stroke-width="2"/>
<circle cx="276" cy="100" r="12" fill="#e4f1ed" stroke="#172033"/><circle cx="135" cy="166" r="7" fill="#e4f1ed" stroke="#172033"/><circle cx="288" cy="180" r="7" fill="#e4f1ed" stroke="#172033"/>
<g stroke="#172033" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M135 166L99 104"/><path d="M135 166V256"/><path d="M135 166L82 197"/><path d="M135 166L201 128"/><path d="M288 180V122"/><path d="M288 180V259"/></g>
<text x="76" y="107">R</text><text x="144" y="253">4g</text><text x="28" y="185">0.25R</text><text x="198" y="117">T</text><text x="302" y="134">T</text><text x="302" y="252">3g</text><text x="111" y="156">A</text><text x="305" y="189">B</text><text x="72" y="226">30°</text>
<path d="M25 290H375" stroke="#d3dbe2"/>
<text x="55" y="332">String forces on the pulley</text>
<circle cx="220" cy="405" r="12" fill="#e4f1ed" stroke="#172033"/>
<g stroke="#172033" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M220 405L107.42 470"/><path d="M220 405V535"/></g>
<path d="M220 452A47 47 0 0 1 179.3 428.5" stroke="#8494a6" fill="none"/>
<text x="88" y="462">T</text><text x="233" y="525">T</text><text x="160" y="474">60°</text><text x="54" y="592">Add these two force vectors.</text>
</g></svg>
