<svg xmlns="http://www.w3.org/2000/svg" width="400" height="390" viewBox="0 0 400 390" role="img" aria-labelledby="title desc">
<title id="title">Projection from a raised point</title><desc id="desc">The origin at launch is fourteen point seven metres above ground. A projectile rises above launch then lands below it. The launch level is y equals zero and ground level is y equals minus h. The horizontal landing distance is measured from the foot of the launch point.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
<rect width="400" height="390" rx="8" fill="white"/>
<g fill="none" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"><path d="M50 212.4H355"/><path d="M50 330V55"/><path d="M50 212.4L105 158.5"/></g>
<path d="M50 212.4Q170 94.8 290 330" stroke="#527568" stroke-width="3" fill="none"/>
<path d="M30 330H360M50 212.4V330" stroke="#8494a6" stroke-width="2"/>
<path d="M290 330V356M50 340V356M50 350H290" stroke="#8494a6" fill="none"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#172033"><text x="25" y="202">O</text><text x="363" y="218">x</text><text x="28" y="58">y</text><text x="264" y="199">y = 0</text><text x="238" y="315">y = −h</text><text x="65" y="279">h = 14.7 m</text><text x="119" y="376">Landing distance</text><text x="104" y="41">Origin at launch</text></g>
</svg>
