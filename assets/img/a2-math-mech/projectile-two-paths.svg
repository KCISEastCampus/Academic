<svg xmlns="http://www.w3.org/2000/svg" width="400" height="390" viewBox="0 0 400 390" role="img" aria-labelledby="title desc">
<title id="title">Two angles reaching a raised target</title><desc id="desc">Two trajectories from the same launch point at speed fourteen metres per second pass through the target ten metres across and five metres up. The angles are forty-five degrees and approximately seventy-one point six degrees. The higher-angle path reaches the target later.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
<rect width="400" height="390" rx="8" fill="white"/>
<g stroke="#172033" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M60 340H365"/><path d="M60 340V65"/></g>
<path d="M60 340Q180 220 300 340" stroke="#527568" stroke-width="3" fill="none"/>
<path d="M60 340Q132 124 204 340" stroke="#426ea8" stroke-width="3" fill="none"/>
<path d="M180 280V340" stroke="#8494a6" stroke-dasharray="5 4"/><circle cx="180" cy="280" r="5" fill="#b54720"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#172033"><text x="37" y="360">O</text><text x="367" y="345">x</text><text x="39" y="70">y</text><text x="195" y="275">Target (10,5)</text><text x="211" y="300" fill="#527568">45°</text><text x="93" y="206" fill="#426ea8">71.6°</text><text x="114" y="375">Same launch speed</text><text x="81" y="37">Two possible trajectories</text></g>
</svg>
