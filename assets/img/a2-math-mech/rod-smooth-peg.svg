<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Rod supported by a smooth peg</title>
  <desc id="desc">A 6 metre uniform rod rises to the right at 30 degrees. Its foot A is on rough ground; a smooth peg touches it at C, 4 metres from A. Peg reaction S acts up and left, perpendicular to the rod. Ground reaction R acts up, ground friction F right and the 80 newton weight acts down at the midpoint.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
  <rect width="400" height="400" rx="8" fill="white"/>
  <g fill="none" stroke="#9aa7b5" stroke-width="2">
    <path d="M25 345H365M85 345A25 25 0 0 0 81.7 332.5M237.7 242.5L232.7 233.8L224 238.8"/>
  </g>
  <circle cx="239.3" cy="255.4" r="10" fill="#e6edf2" stroke="#9aa7b5" stroke-width="2"/>
  <path d="M60 345L320 195" stroke="#527568" stroke-width="8"/>
  <g stroke="#172033" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M233.3 245L190 170"/><path d="M60 345V235"/><path d="M60 345H170"/><path d="M190 270V335"/>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="21">
    <text x="34" y="374">A</text><text x="329" y="198">B</text><text x="255" y="247">C</text>
    <text x="170" y="161">S</text><text x="25" y="270">R</text><text x="145" y="374">F</text>
    <text x="205" y="314">80 N</text><text x="115" y="339">30°</text>
    <text x="86" y="279">4 m</text><text x="264" y="196">2 m</text>
  </g>
</svg>
