<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">A particle supported by two strings</title>
  <desc id="desc">The left string is at 30 degrees to the horizontal and the right string is at 60 degrees. Tensions pull upwards along the strings; the weight is 60 newtons downwards.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
  <rect width="400" height="300" rx="8" fill="white"/>
  <g fill="none" stroke="#9aa7b5" stroke-width="2">
    <path d="M60 45H345M80 45L260 149L320 45"/>
    <path d="M120 45A40 40 0 0 1 114.6 65M285 45A35 35 0 0 0 302.5 75.3"/>
  </g>
  <g stroke="#172033" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M260 149L165 94"/><path d="M260 149L300 80"/><path d="M260 149V260"/>
  </g>
  <circle cx="260" cy="149" r="7" fill="#d9eee5" stroke="#172033" stroke-width="1.5"/>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="21">
    <text x="117" y="78">30°</text><text x="262" y="83">60°</text>
    <text x="160" y="130">T<tspan font-size="15" dy="5">A</tspan></text>
    <text x="311" y="121">T<tspan font-size="15" dy="5">B</tspan></text>
    <text x="274" y="230">60 N</text>
    <text x="68" y="33">A</text><text x="314" y="33">B</text>
  </g>
</svg>
