<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
<title id="title">Work uses the force component along motion</title><desc id="desc">A block moves right on a fixed horizontal plane. A pulling force F acts at angle theta above horizontal, friction f acts left, normal reaction R acts up and weight mg acts down. The distance s and the horizontal component F cos theta determine the work done by the pull.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172033"/></marker></defs>
<rect width="400" height="320" rx="8" fill="white"/>
<path d="M25 226H375" stroke="#8494a6" stroke-width="2"/><rect x="152" y="166" width="70" height="60" rx="4" fill="#dcece4" stroke="#527568" stroke-width="2"/>
<g fill="none" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"><path d="M187 196L295 88"/><path d="M187 196H87"/><path d="M187 196V89"/><path d="M187 196V280"/><path d="M55 295H340"/></g>
<path d="M187 196H295V88" stroke="#8494a6" fill="none" stroke-dasharray="5 4"/>
<path d="M222 196A35 35 0 0 0 212 171" stroke="#8494a6" fill="none"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#172033"><text x="306" y="86">F</text><text x="158" y="83">R</text><text x="62" y="197">f</text><text x="200" y="272">mg</text><text x="226" y="178">θ</text><text x="272" y="219">F cos θ</text><text x="88" y="40">Motion is to the right</text><text x="178" y="316">s</text></g>
</svg>
