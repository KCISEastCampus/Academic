<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img" aria-labelledby="title desc"><title id="title">Full acid-catalysed dehydration of propan-2-ol</title><desc id="desc">Hydronium donates a proton to the alcohol oxygen lone pair, with its O-H bond pair returning to its oxygen. The protonated alcohol loses water by C-O bond cleavage to oxygen. A water lone pair accepts a beta hydrogen and the beta C-H bond pair forms C=C, producing propene and regenerating hydronium. All stages have total charge plus one. Nonreacting lone pairs are omitted.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="680" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="340" y="26" font-size="21">Heated acidic conditions; catalyst shown as H₃O⁺</text><text x="123" y="61" font-size="18">1. Protonate oxygen</text><text x="112" y="151" font-size="24">(CH₃)₂CH</text><text x="238" y="151" font-size="25">O</text><text x="305" y="151" font-size="25">H</text><path d="M172 143 L224 143" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M252 143 L290 143" stroke="#172433" stroke-width="2.2" fill="none"/><circle cx="234.5" cy="120" r="2.3"/><circle cx="241.5" cy="120" r="2.3"/><text x="238" y="81" font-size="24">H</text><text x="340" y="81" font-size="24">O⁺</text><text x="400" y="81" font-size="24">H</text><text x="340" y="131" font-size="24">H</text><path d="M253 73 L325 73" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M359 73 L387 73" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M340 87 L340 107" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M238 120 C206 111 208 87 229 81" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M288 73 C285 39 331 38 337 58" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M426 145 L466 145" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="561" y="128" font-size="22">(CH₃)₂CH–OH₂⁺</text><text x="560" y="165" font-size="22">+ H₂O</text><path d="M20 192 L660 192" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="130" y="230" font-size="18">2. Water leaves</text><text x="147" y="284" font-size="24">(CH₃)₂CH</text><text x="289" y="284" font-size="25">OH₂⁺</text><path d="M209 276 L252 276" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M232 276 C218 233 267 232 266 264" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M368 276 L424 276" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="545" y="267" font-size="25">(CH₃)₂CH⁺</text><text x="545" y="307" font-size="23">+ H₂O</text><text x="340" y="351" font-size="19">C⁺ has three bonds; leaving oxygen is neutral water.</text><path d="M20 375 L660 375" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="180" y="412" font-size="18">3. Lose β-H and regenerate H₃O⁺</text><text x="170" y="527" font-size="25">CH₂</text><text x="296" y="527" font-size="25">C⁺H</text><text x="420" y="527" font-size="25">CH₃</text><path d="M198 519 L267 519" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M324 519 L390 519" stroke="#172433" stroke-width="2.2" fill="none"/><text x="170" y="455" font-size="24">H</text><path d="M170 464 L170 502" stroke="#172433" stroke-width="2.2" fill="none"/><text x="73" y="455" font-size="23">H₂O</text><circle cx="105.5" cy="447" r="2.3"/><circle cx="112.5" cy="447" r="2.3"/><path d="M109 447 C125 414 156 415 168 434" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M170 484 C210 461 247 478 235 514" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M463 518 L501 518" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="585" y="500" font-size="22">CH₂=CHCH₃</text><text x="585" y="539" font-size="24">+ H₃O⁺</text><text x="340" y="599" font-size="22">Net: CH₃CH(OH)CH₃ → CH₂=CHCH₃ + H₂O</text><text x="340" y="638" font-size="18">Full-headed curved arrows = electron pairs. Total charge stays +1.</text><text x="340" y="667" font-size="17">Secondary-alcohol model; do not invent a free primary ethanol cation.</text></g></svg>