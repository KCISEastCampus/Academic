<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" aria-labelledby="title desc"><title id="title">Distillation apparatus schematic for a volatile product</title><desc id="desc">A sealed thermometer bung closes the reaction flask head. The vapour passage is continuous through the side arm to a distinct inner condenser tube. The separate outer cooling-water jacket has a lower inlet and upper outlet. The flask is in a water bath with granules added before heating. A cold receiver is vented; it is the open end of the apparatus. Supports omitted, schematic not an assembly recipe.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="480" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="340" y="28" font-size="21">RP4: closed reaction head → condenser → vented receiver</text><rect x="60" y="278" width="170" height="91" fill="#e9f4fa" stroke="#65798e" stroke-width="1.5"/><path d="M115 149 L115 211 C53 245 75 319 140 328 C210 319 227 246 165 211 L165 168 M165 150 L165 149 L115 149" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M88 282 Q140 272 199 282" stroke="#172433" stroke-width="2.2" fill="none"/><text x="140" y="305" font-size="17">reaction</text><rect x="112" y="313" width="4" height="4" fill="#172433" stroke="#65798e" stroke-width="1.5"/><rect x="147" y="316" width="4" height="4" fill="#172433" stroke="#65798e" stroke-width="1.5"/><rect x="177" y="311" width="4" height="4" fill="#172433" stroke="#65798e" stroke-width="1.5"/><rect x="113" y="138" width="54" height="12" fill="#d4c4a7" stroke="#65798e" stroke-width="1.5"/><path d="M140 65 L140 159" stroke="#172433" stroke-width="2.2" fill="none"/><circle cx="140" cy="166" r="6" fill="#172433"/><text x="311" y="83" font-size="17">Thermometer through bung</text><path d="M211 88 L152 140" stroke="#65798e" stroke-width="1" fill="none"/><text x="312" y="110" font-size="17">Bulb at vapour take-off</text><path d="M218 114 L148 165" stroke="#65798e" stroke-width="1" fill="none"/><path d="M165 150 L245 150 L490 279 L522 279 L522 336" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M165 168 L237 168 L482 297 L504 297 L504 336" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M260 133 L506 263 M232 185 L478 315" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M260 133 L251 150 M240 170 L232 185 M506 263 L497 280 M486 300 L478 315" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M282 145 L294 121 L323 121" stroke="#172433" stroke-width="2.2" fill="none"/><text x="421" y="128" font-size="17">Water OUT (upper)</text><path d="M447 299 L434 326 L399 326" stroke="#172433" stroke-width="2.2" fill="none"/><text x="352" y="348" font-size="17">Water IN (lower)</text><path d="M349 215 L393 238" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="140" y="393" font-size="19">Water bath</text><text x="143" y="437" font-size="18">Granules before heating</text><path d="M209 418 L180 320" stroke="#65798e" stroke-width="1" fill="none"/><rect x="454" y="386" width="180" height="62" fill="#e9f4fa" stroke="#65798e" stroke-width="1.5"/><path d="M486 355 L486 408 Q539 437 591 408 L591 355" stroke="#172433" stroke-width="2.2" fill="none"/><text x="605" y="356" font-size="17">vent</text><text x="540" y="376" font-size="17">receiver</text><text x="546" y="473" font-size="18">Ice / cold bath</text><text x="430" y="445" font-size="16">Supports/clamps omitted.</text></g></svg>