<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc"><title id="title">Fractionating column schematic</title><desc id="desc">Heated crude vapour enters the hot lower column. The column becomes cooler upwards. Shorter-chain low-boiling mixture exits high up; middle and longer-chain fractions condense lower. Residue exits the bottom. This diagram is not to scale and gives no universal fraction boundaries.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="420" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="340" y="28" font-size="21">Fractionation: physical separation, not C–C cleavage</text><rect x="260" y="62" width="125" height="292" fill="#e9f0f7" stroke="#65798e" stroke-width="1.5"/><path d="M260 115 L350 115" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M365 125 L385 125" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M260 175 L350 175" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M365 185 L385 185" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M260 235 L350 235" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M365 245 L385 245" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M260 295 L350 295" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M365 305 L385 305" stroke="#172433" stroke-width="2.2" fill="none"/><text x="321" y="91" font-size="19">COOL</text><text x="321" y="333" font-size="19">HOT</text><path d="M65 301 L255 301" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="135" y="277" font-size="19">Heated crude</text><text x="135" y="331" font-size="18">vapour + liquid</text><path d="M386 105 L458 105" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="563" y="100" font-size="19">Shorter chains</text><text x="563" y="126" font-size="17">Lower boiling range</text><path d="M386 205 L458 205" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="563" y="200" font-size="19">Middle fractions</text><text x="563" y="226" font-size="17">Each is a mixture</text><path d="M386 290 L458 290" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="563" y="285" font-size="19">Longer chains</text><text x="563" y="311" font-size="17">Higher boiling range</text><path d="M320 354 L320 390" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="445" y="389" font-size="19">Residue</text><path d="M231 275 L231 118" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="140" y="180" font-size="18">Vapours rise</text><text x="340" y="416" font-size="17">Schematic; fraction boundaries vary with feed and plant.</text></g></svg>