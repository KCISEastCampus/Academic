<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title desc"><title id="title">Bromine addition with a bromonium bridge</title><desc id="desc">Dry nonaqueous Br2 addition to ethene. Three pair arrows form the bridge: pi bond to nearer Br, Br-Br bond to farther Br, nearer-Br lone pair to the other alkene carbon. Then bromide attacks a bridge carbon and that carbon-Br bond returns its pair to bridge Br. 1,2-dibromoethane results; only reacting lone pairs are drawn.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="560" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="340" y="27" font-size="21">Dry, inert nonaqueous medium: Br₂ addition</text><text x="490" y="65" font-size="18">1. Close the bridge</text><text x="170" y="198" font-size="24">CH₂</text><text x="290" y="198" font-size="24">CH₂</text><path d="M198 184 L263 184" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M198 193 L263 193" stroke="#172433" stroke-width="2.2" fill="none"/><text x="170" y="102" font-size="25">Br</text><text x="290" y="102" font-size="25">Br</text><path d="M191 94 L267 94" stroke="#172433" stroke-width="2.2" fill="none"/><circle cx="142.5" cy="93" r="2.3"/><circle cx="149.5" cy="93" r="2.3"/><text x="167" y="68" font-size="16">δ+</text><text x="290" y="68" font-size="16">δ−</text><path d="M223 184 C220 142 196 114 177 110" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M230 94 C241 51 289 54 291 79" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M146 93 C90 135 254 142 285 174" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M360 180 L411 180" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="490" y="198" font-size="24">CH₂</text><text x="610" y="198" font-size="24">CH₂</text><path d="M517 190 L582 190" stroke="#172433" stroke-width="2.2" fill="none"/><text x="550" y="113" font-size="25">Br⁺</text><path d="M494 172 L535 119" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M605 172 L568 119" stroke="#172433" stroke-width="2.2" fill="none"/><text x="550" y="237" font-size="24">+ Br⁻</text><path d="M20 266 L660 266" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="118" y="306" font-size="18">2. Open the bridge</text><text x="190" y="411" font-size="24">CH₂</text><text x="310" y="411" font-size="24">CH₂</text><path d="M218 402 L282 402" stroke="#172433" stroke-width="2.2" fill="none"/><text x="250" y="329" font-size="25">Br⁺</text><path d="M195 386 L234 335" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M305 386 L268 335" stroke="#172433" stroke-width="2.2" fill="none"/><text x="78" y="407" font-size="24">Br⁻</text><circle cx="107.5" cy="399" r="2.3"/><circle cx="114.5" cy="399" r="2.3"/><path d="M111 399 C130 355 162 359 176 387" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M214 361 C185 318 213 299 242 308" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M375 401 L424 401" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="544" y="408" font-size="25">BrCH₂–CH₂Br</text><text x="340" y="481" font-size="21">1,2-dibromoethane; no stable five-bond carbon.</text><text x="340" y="521" font-size="18">Bromine water is a qualitative test; water can compete.</text><text x="340" y="548" font-size="17">Bridge model supplied; advanced stereochemistry not required.</text></g></svg>