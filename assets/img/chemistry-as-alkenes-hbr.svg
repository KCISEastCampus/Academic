<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc"><title id="title">HBr addition to propene</title><desc id="desc">The alkene pi pair attacks hydrogen of HBr while the H-Br bond pair moves to Br, forming a secondary carbocation and bromide. A bromide lone pair attacks the positive carbon to give 2-bromopropane. A separate minor route has a primary carbocation and yields 1-bromopropane.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="500" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="340" y="27" font-size="22">HBr + propene: ordinary ionic addition</text><text x="510" y="66" font-size="19">1. Protonation</text><text x="170" y="155" font-size="25">CH₂</text><text x="280" y="155" font-size="25">CH</text><text x="390" y="155" font-size="25">CH₃</text><path d="M197 143 L255 143" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M197 151 L255 151" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M307 147 L360 147" stroke="#172433" stroke-width="2.2" fill="none"/><text x="170" y="83" font-size="24">H</text><text x="280" y="83" font-size="24">Br</text><path d="M184 75 L253 75" stroke="#172433" stroke-width="2.2" fill="none"/><text x="152" y="56" font-size="16">δ+</text><text x="303" y="56" font-size="16">δ−</text><path d="M225 143 C215 104 194 95 174 91" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M220 75 C227 35 278 35 280 59" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M430 147 L477 147" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="562" y="122" font-size="23">CH₃–C⁺H–CH₃</text><text x="562" y="158" font-size="23">+ Br⁻</text><text x="562" y="187" font-size="18">secondary</text><path d="M20 210 L660 210" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="95" y="244" font-size="19">2. Capture</text><text x="170" y="309" font-size="25">Br⁻</text><circle cx="203.5" cy="300" r="2.3"/><circle cx="210.5" cy="300" r="2.3"/><text x="365" y="309" font-size="25">CH₃–C⁺H–CH₃</text><path d="M207 300 C252 245 321 247 365 288" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M478 301 L521 301" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="583" y="286" font-size="21">CH₃CHBrCH₃</text><text x="583" y="321" font-size="18">major</text><path d="M20 350 L660 350" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="340" y="388" font-size="23">Alternative orientation: CH₃CH₂CH₂⁺ + Br⁻</text><text x="340" y="421" font-size="22">primary cation → CH₃CH₂CH₂Br (minor)</text><text x="340" y="458" font-size="20">Alkyl electron donation: 3° &gt; 2° &gt; 1° cation stability</text><text x="340" y="486" font-size="17">Curved arrows show pairs; straight arrows link stages.</text></g></svg>