<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title desc"><title id="title">Propene to repeat unit and a student chain segment</title><desc id="desc">A worked propene polymerisation keeps the methyl side group and two-carbon backbone. The repeat-unit bonds cross both brackets with n outside. A separate PVC chain segment is provided for conversion by the student.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="300" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="340" y="28" font-size="21">Keep the side group; change C=C to backbone C–C</text><text x="117" y="105" font-size="23">n CH₂=CH–CH₃</text><path d="M220 97 L287 97" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="375" y="105" font-size="24">CH₂</text><text x="480" y="105" font-size="24">CH</text><path d="M310 97 L345 97" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M404 97 L450 97" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M505 97 L575 97" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M480 113 L480 139" stroke="#172433" stroke-width="2.2" fill="none"/><text x="480" y="163" font-size="23">CH₃</text><path d="M337 58 L326 58 L326 181 L337 181" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M546 58 L557 58 L557 181 L546 181" stroke="#172433" stroke-width="2.2" fill="none"/><text x="575" y="188" font-size="21">n</text><path d="M20 203 L660 203" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="340" y="235" font-size="19">Student segment — extract one repeat unit</text><text x="340" y="276" font-size="25">–CH₂–CHCl–CH₂–CHCl–</text></g></svg>