<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" aria-labelledby="title desc"><title id="title">Sulfuric acid addition to ethene</title><desc id="desc">Ethene pi pair attacks H of H-O-SO3H while the O-H bond pair moves to oxygen. An ethyl cation and HSO4 minus form. The negatively charged oxygen lone pair attacks the positive carbon, giving ethyl hydrogensulfate with a C-O bond.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="440" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="340" y="27" font-size="22">Cool concentrated H₂SO₄: addition</text><text x="92" y="67" font-size="18">1. Protonation</text><text x="170" y="172" font-size="25">CH₂</text><text x="280" y="172" font-size="25">CH₂</text><path d="M198 160 L253 160" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M198 168 L253 168" stroke="#172433" stroke-width="2.2" fill="none"/><text x="170" y="96" font-size="24">H</text><text x="280" y="96" font-size="24">O</text><text x="380" y="96" font-size="24">SO₃H</text><path d="M184 88 L265 88" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M295 88 L344 88" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M223 160 C217 119 191 108 173 104" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M225 88 C231 44 281 46 280 72" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M425 163 L473 163" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="563" y="145" font-size="25">CH₃CH₂⁺</text><text x="563" y="180" font-size="24">+ ⁻O–SO₃H</text><path d="M20 215 L660 215" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="100" y="250" font-size="18">2. O donates</text><text x="150" y="303" font-size="25">⁻O</text><circle cx="174.5" cy="294" r="2.3"/><circle cx="181.5" cy="294" r="2.3"/><text x="84" y="303" font-size="22">HO₃S</text><path d="M112 295 L129 295" stroke="#172433" stroke-width="2.2" fill="none"/><text x="310" y="303" font-size="25">CH₂⁺</text><text x="410" y="303" font-size="25">CH₃</text><path d="M340 295 L382 295" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M178 294 C212 247 275 246 306 280" stroke="#a12545" stroke-width="2.4" fill="none" marker-end="url(#pair)"/><path d="M464 296 L510 296" stroke="#172433" stroke-width="2.2" fill="none" marker-end="url(#flow)"/><text x="565" y="332" font-size="21">CH₃CH₂OSO₃H</text><text x="340" y="377" font-size="21">New bond: carbon to oxygen, not carbon to sulfur.</text><text x="340" y="415" font-size="19">Product: ethyl hydrogensulfate. Net charge 0.</text></g></svg>