<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">A donated pair forms ammonium</title><desc id="desc">Nitrogen in ammonia has three N H bonds and a lone pair. Nitrogen donates to H plus, forming ammonium with four equivalent bonds.</desc><rect width="640" height="240" fill="white"/><g font-family="Arial,sans-serif" font-size="26" fill="#172433" text-anchor="middle"><text x="135" y="120">N</text><text x="135" y="45">H</text><text x="50" y="120">H</text><text x="135" y="205">H</text><path d="M135 55V90 M65 111H115 M135 130V175" fill="none" stroke="#172433" stroke-width="2.5"/><circle cx="161" cy="104" r="3"/><circle cx="161" cy="117" r="3"/><text x="230" y="120">+ H⁺</text><text x="320" y="120">→</text><text x="470" y="120">N</text><text x="470" y="45">H</text><text x="390" y="120">H</text><text x="550" y="120">H</text><text x="470" y="205">H</text><path d="M470 55V90 M405 111H450 M470 130V175 M490 111H529" fill="none" stroke="#172433" stroke-width="2.5"/><path d="M518 105L529 111 518 117" fill="none" stroke="#172433" stroke-width="2.5"/><path d="M370 25H360V215H370 M570 25H580V215H570" fill="none" stroke="#172433" stroke-width="2"/><text x="600" y="40">+</text><text x="470" y="237" font-size="16">Donor arrow records origin; all four bonds are equivalent.</text></g></svg>