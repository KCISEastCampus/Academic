<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="t d"><title id="t">Five and six directions in space</title><desc id="d">Trigonal bipyramidal PCl5 has two axial bonds and three equatorial bonds; the latter lie in a plane. Octahedral SF6 has two axial bonds and four equatorial bonds. Solid wedges come towards the reader and dashed bonds go away. Projection is schematic.</desc><rect width="640" height="390" fill="white"/><g fill="#172433" font-family="Arial,sans-serif" text-anchor="middle" font-size="22"><text x="160" y="32">PCl₅: trigonal bipyramidal</text><text x="480" y="32">SF₆: octahedral</text><text x="160" y="194">P</text><text x="160" y="75">Cl</text><text x="160" y="315">Cl</text><text x="48" y="187">Cl</text><text x="260" y="133">Cl</text><text x="258" y="255">Cl</text><path d="M160 85V165 M160 206V285 M68 180H140" stroke="#172433" stroke-width="2.5" fill="none"/><path d="M179 174L241 130" stroke="#172433" stroke-width="3" stroke-dasharray="5 5"/><path d="M178 199L244 235 234 250Z" fill="#172433"/><text x="480" y="194">S</text><text x="480" y="75">F</text><text x="480" y="315">F</text><text x="378" y="132">F</text><text x="580" y="132">F</text><text x="378" y="255">F</text><text x="580" y="255">F</text><path d="M480 85V165 M480 206V285 M464 173L390 136 M496 173L567 136" stroke="#172433" stroke-width="2.5" stroke-dasharray="5 5" fill="none"/><path d="M480 85V165 M480 206V285" stroke="#172433" stroke-width="2.5" fill="none"/><path d="M465 197L389 235 399 250Z M495 197L560 250 570 235Z" fill="#172433"/><text x="320" y="353" font-size="18">Vertical = axial; remaining bonds = equatorial plane</text><text x="320" y="380" font-size="16">Solid wedge: towards you · dashed: away · schematic projection</text></g></svg>