<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc">
<title id="title">Constructed temperature-time demonstration</title>
<desc id="desc">Constructed data, not measurements. Time in seconds is horizontal, temperature in degrees Celsius vertical. Baseline readings at 0, 30, 60 and 90 seconds are all 20.0. Mixing at 120 seconds has no reading. Post-reaction readings at 150 to 300 seconds decrease by 0.1 degree every 30 seconds from 26.7 to 26.2. The cooling line extends backwards to 26.8 at mixing, giving a corrected rise of 6.8 kelvin above the baseline. Dashed lines denote extrapolation rather than measured data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17466b"/></marker></defs>
<rect width="600" height="490" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172b4d" font-size="21">
<text x="24" y="32" font-size="23" font-weight="bold">Constructed example: correction at mixing</text>
<g stroke="#d5dee6" stroke-width="1"><path d="M90 350H535M90 270H535M90 190H535M90 110H535M90 70H535"/></g>
<path d="M90 60V380H550" stroke="#475569" fill="none" stroke-width="2"/>
<text x="53" y="357">20</text><text x="53" y="277">22</text><text x="53" y="197">24</text><text x="53" y="117">26</text><text x="53" y="77">27</text>
<text transform="translate(27 300) rotate(-90)">Temperature / °C</text>
<text x="84" y="407">0</text><text x="238" y="407">120</text><text x="490" y="407">300</text><text x="380" y="436">Time / s</text>
<path d="M258 62V380" stroke="#64748b" stroke-dasharray="4 6" stroke-width="2"/>
<text x="198" y="437">Mix</text>
<path d="M90 350H216" stroke="#17466b" stroke-width="2"/><path d="M216 350H258M258 78L300 82" stroke="#17466b" stroke-dasharray="8 5" stroke-width="3"/>
<path d="M300 82L510 102" stroke="#17466b" stroke-width="2"/>
<g fill="#17466b"><circle cx="90" cy="350" r="4"/><circle cx="132" cy="350" r="4"/><circle cx="174" cy="350" r="4"/><circle cx="216" cy="350" r="4"/><circle cx="300" cy="82" r="4"/><circle cx="342" cy="86" r="4"/><circle cx="384" cy="90" r="4"/><circle cx="426" cy="94" r="4"/><circle cx="468" cy="98" r="4"/><circle cx="510" cy="102" r="4"/></g>
<text x="153" y="66">26.8 °C</text><text x="366" y="67">Cooling fit</text><text x="103" y="331">Baseline</text>
<path d="M279 82V346" stroke="#17466b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="296" y="219">ΔT = 6.8 K</text>
<text x="24" y="472" font-size="19">● Reading     — Fit     - - Extrapolation</text>
</g>
</svg>
