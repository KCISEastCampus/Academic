<svg xmlns="http://www.w3.org/2000/svg" width="700" height="980" viewBox="0 0 700 980" role="img" aria-labelledby="t d"><title id="t">Acid-catalysed epoxyethane opening with water</title><desc id="d">Three stages: protonate the ring oxygen, water attacks carbon while its ring C O bond opens, then deprotonate the incoming oxonium oxygen. Each arrow begins at a visible lone pair or bond. Diol and hydronium form.</desc><defs><marker id="a" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#a12545"/></marker></defs><rect width="700" height="980" fill="white"/><g fill="#172433" font-family="Arial,sans-serif" text-anchor="middle" font-size="27"><text x="350" y="35" font-size="22">1. Ring oxygen donates to H⁺</text><text x="350" y="125">O</text><text x="250" y="225">CH₂</text><text x="450" y="225">CH₂</text><path d="M335 135L270 200 M365 135L430 200 M280 216H420" fill="none" stroke="#172433" stroke-width="2.5"/><circle cx="343" cy="96" r="3"/><circle cx="355" cy="96" r="3"/><circle cx="325" cy="109" r="3"/><circle cx="325" cy="120" r="3"/><text x="510" y="95">H⁺</text><path d="M349 96C380 43 463 45 490 82" stroke="#a12545" stroke-width="2.7" fill="none" marker-end="url(#a)"/><text x="350" y="280" font-size="20">Product of step 1 is the protonated ring below.</text><text x="350" y="325" font-size="22">2. Water attacks; one ring C–O bond opens</text><text x="350" y="407">O</text><text x="377" y="384" font-size="21">+</text><text x="350" y="357">H</text><text x="250" y="507">CH₂</text><text x="450" y="507">CH₂</text><path d="M350 366V378 M334 415L270 481 M366 415L430 481 M280 498H420" fill="none" stroke="#172433" stroke-width="2.5"/><text x="95" y="415">H</text><text x="140" y="415">O</text><text x="185" y="415">H</text><path d="M110 405H123 M157 405H169" stroke="#172433" stroke-width="2.5"/><circle cx="134" cy="435" r="3"/><circle cx="146" cy="435" r="3"/><path d="M140 435C156 480 193 498 217 498" stroke="#a12545" stroke-width="2.7" fill="none" marker-end="url(#a)"/><path d="M303 447C250 365 294 359 334 385" stroke="#a12545" stroke-width="2.7" fill="none" marker-end="url(#a)"/><text x="350" y="560" font-size="24">HO–CH₂–CH₂–OH₂⁺</text><text x="350" y="605" font-size="20">Incoming O now has three bonds and carries +.</text><text x="350" y="665" font-size="22">3. Transfer a proton back to water</text><text x="205" y="795">HOCH₂CH₂</text><text x="400" y="795">O</text><text x="424" y="770" font-size="21">+</text><text x="400" y="727">H</text><text x="500" y="795">H</text><path d="M283 786H380 M400 738V764 M420 786H480" fill="none" stroke="#172433" stroke-width="2.5"/><text x="585" y="715">H₂O</text><circle cx="579" cy="736" r="3"/><circle cx="591" cy="736" r="3"/><path d="M585 736C576 779 548 786 519 786" stroke="#a12545" stroke-width="2.7" fill="none" marker-end="url(#a)"/><path d="M450 786C453 837 407 835 402 808" stroke="#a12545" stroke-width="2.7" fill="none" marker-end="url(#a)"/><text x="350" y="905">HOCH₂CH₂OH + H₃O⁺</text><text x="350" y="952" font-size="19">Acid regenerated · nonreacting lone pairs omitted after step 1</text></g></svg>