<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
<title id="title">Dynamic equilibrium: forward and reverse rates</title>
<desc id="desc">Constructed schematic, not measured data. Rate is vertical and time horizontal. Starting with reactants only, the forward rate is initially positive and the reverse rate zero. Forward rate decreases while reverse rate increases towards the same positive equilibrium rate. The solid forward curve and dashed reverse curve are labelled. Their equal positive limits mean reactions continue with no net composition change; they do not imply equal reactant and product concentrations. Values and equilibration time are not specified.</desc>
