<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">CIP worked example and an unassigned student structure</title><desc id="desc">Left example has Br above and Cl below the left double-bond carbon, H above and Cl below the right carbon: high-priority Br and right Cl are opposite, E. Right scaffold: left CH2OH above, ethyl below; right methyl above, hydrogen below; no assignment is supplied.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="340" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="170" y="30" font-size="23">Worked: E</text><text x="510" y="30" font-size="21">Your turn: assign E or Z</text><text x="125" y="164" font-size="23">C</text><text x="215" y="164" font-size="23">C</text><path d="M140 153 L200 153" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M140 160 L200 160" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M117 144 L75 103" stroke="#172433" stroke-width="2.2" fill="none"/><text x="60" y="91" font-size="20">Br</text><path d="M117 172 L75 199" stroke="#172433" stroke-width="2.2" fill="none"/><text x="60" y="221" font-size="20">Cl</text><path d="M223 144 L265 103" stroke="#172433" stroke-width="2.2" fill="none"/><text x="280" y="91" font-size="20">H</text><path d="M223 172 L265 199" stroke="#172433" stroke-width="2.2" fill="none"/><text x="280" y="221" font-size="20">Cl</text><text x="465" y="164" font-size="23">C</text><text x="555" y="164" font-size="23">C</text><path d="M480 153 L540 153" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M480 160 L540 160" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M457 144 L415 103" stroke="#172433" stroke-width="2.2" fill="none"/><text x="400" y="91" font-size="20">CH₂OH</text><path d="M457 172 L415 199" stroke="#172433" stroke-width="2.2" fill="none"/><text x="400" y="221" font-size="20">CH₂CH₃</text><path d="M563 144 L605 103" stroke="#172433" stroke-width="2.2" fill="none"/><text x="620" y="91" font-size="20">CH₃</text><path d="M563 172 L605 199" stroke="#172433" stroke-width="2.2" fill="none"/><text x="620" y="221" font-size="20">H</text><path d="M337 50 L337 280" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="170" y="280" font-size="20">Br &gt; Cl; Cl &gt; H</text><text x="340" y="320" font-size="19">Same connections + restricted C=C rotation → spatial isomers</text></g></svg>