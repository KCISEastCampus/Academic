<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="title desc"><title id="title">One molecule in three representations</title><desc id="desc">Propan-1-ol structural formula, fully displayed formula and skeletal formula; the two unlabelled carbon ends or vertices and terminal carbon before oxygen make three carbons. The oxygen and its hydrogen are explicit.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker><marker id="flow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#172433"/></marker></defs><rect width="680" height="360" fill="white"/><g font-family="Arial, sans-serif" fill="#172433" text-anchor="middle"><text x="340" y="30" font-size="22">Propan-1-ol: count C first, then H</text><text x="145" y="80" font-size="19">Structural</text><text x="470" y="58" font-size="19">Displayed</text><text x="145" y="132" font-size="25">CH₃CH₂CH₂OH</text><text x="340" y="132" font-size="23">C</text><text x="415" y="132" font-size="23">C</text><text x="490" y="132" font-size="23">C</text><text x="565" y="132" font-size="23">O</text><text x="635" y="132" font-size="23">H</text><path d="M352 124 L402 124" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M427 124 L477 124" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M502 124 L552 124" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M577 124 L622 124" stroke="#172433" stroke-width="2.2" fill="none"/><text x="340" y="91" font-size="20">H</text><path d="M340 96 L340 110" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M340 142 L340 159" stroke="#172433" stroke-width="2.2" fill="none"/><text x="340" y="181" font-size="20">H</text><text x="415" y="91" font-size="20">H</text><path d="M415 96 L415 110" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M415 142 L415 159" stroke="#172433" stroke-width="2.2" fill="none"/><text x="415" y="181" font-size="20">H</text><text x="490" y="91" font-size="20">H</text><path d="M490 96 L490 110" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M490 142 L490 159" stroke="#172433" stroke-width="2.2" fill="none"/><text x="490" y="181" font-size="20">H</text><text x="285" y="132" font-size="20">H</text><path d="M298 124 L326 124" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M20 205 L660 205" stroke="#b9c6d4" stroke-width="1" fill="none"/><text x="120" y="245" font-size="19">Skeletal</text><path d="M280 295 L345 253" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M345 253 L410 295" stroke="#172433" stroke-width="2.2" fill="none"/><path d="M410 295 L454 267" stroke="#172433" stroke-width="2.2" fill="none"/><text x="472" y="267" font-size="23">OH</text><text x="280" y="325" font-size="17">C1</text><text x="345" y="234" font-size="17">C2</text><text x="410" y="325" font-size="17">C3</text><text x="560" y="290" font-size="19">O is not C4</text><text x="550" y="325" font-size="15">Count labels, not locants</text></g></svg>