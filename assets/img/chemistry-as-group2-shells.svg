<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title desc">
  <title id="title">Mg and Ca: two outer electrons, different occupied shells</title>
  <desc id="desc">Mg has three occupied shells and a nucleus with twelve protons; Ca has four occupied shells and twenty protons. Each has two outer electrons shown as circles with minus signs. Inner electrons are represented by shaded inner-shell regions, not drawn individually. The diagram is schematic and is not to scale.</desc>
  <rect width="680" height="330" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172e42" text-anchor="middle">
    <text x="340" y="28" font-size="20" font-weight="bold">Same outer count; an extra inner shell</text>
    <text x="185" y="59" font-size="17" font-weight="bold">Mg: 3 occupied shells</text>
    <text x="485" y="59" font-size="17" font-weight="bold">Ca: 4 occupied shells</text>
    <circle cx="185" cy="163" r="51" fill="#e1e8ef"/>
    <circle cx="485" cy="163" r="68" fill="#e1e8ef"/>
    <g fill="none" stroke="#62788a" stroke-width="1.5">
      <circle cx="185" cy="163" r="27"/>
      <circle cx="185" cy="163" r="51"/>
      <circle cx="485" cy="163" r="27"/>
      <circle cx="485" cy="163" r="47"/>
      <circle cx="485" cy="163" r="68"/>
    </g>
    <g fill="none" stroke="#165e82" stroke-width="3">
      <circle cx="185" cy="163" r="76"/>
      <circle cx="485" cy="163" r="94"/>
    </g>
    <g fill="#f2d8c9" stroke="#845236" stroke-width="1.5">
      <circle cx="185" cy="163" r="20"/>
      <circle cx="485" cy="163" r="20"/>
    </g>
    <g font-size="12" font-weight="bold">
      <text x="185" y="167">12 p+</text>
      <text x="485" y="167">20 p+</text>
    </g>
    <g fill="#165e82" stroke="#0e425c" stroke-width="1">
      <circle cx="109" cy="163" r="10"/>
      <circle cx="261" cy="163" r="10"/>
      <circle cx="391" cy="163" r="10"/>
      <circle cx="579" cy="163" r="10"/>
    </g>
    <g fill="#ffffff" font-size="17" font-weight="bold">
      <text x="109" y="168">−</text>
      <text x="261" y="168">−</text>
      <text x="391" y="168">−</text>
      <text x="579" y="168">−</text>
    </g>
    <text x="185" y="271" font-size="17">[Ne] 3s²</text>
    <text x="485" y="271" font-size="17">[Ar] 4s²</text>
    <text x="340" y="298" font-size="15">Shaded region = inner shells; − circle = outer electron</text>
    <text x="340" y="319" font-size="14">Schematic, not to scale; inner electrons are not drawn individually.</text>
  </g>
</svg>
