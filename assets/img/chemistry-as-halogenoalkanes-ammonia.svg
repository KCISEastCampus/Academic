<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img" aria-labelledby="title desc"><title id="title">Ammonia substitution and deprotonation</title><desc id="desc">Neutral ammonia donates its nitrogen lone pair to carbon; the carbon bromine pair goes to bromine. Ethylammonium has four nitrogen bonds and positive nitrogen. Second ammonia donates a lone pair to an N-bound hydrogen; the N H pair returns to nitrogen. Ethylamine, ammonium and bromide result.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker></defs><rect width="680" height="610" fill="#fff"/><g fill="#172433" font-family="Arial, sans-serif" font-size="27" text-anchor="middle"><text x="150" y="180" font-size="27">CH₃</text><text x="285" y="180" font-size="27">C</text><text x="425" y="180" font-size="27">Br</text><text x="285" y="111" font-size="27">H</text><text x="285" y="250" font-size="27">H</text><path d="M181 171 L266 171" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M304 171 L400 171" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M285 120 L285 150" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M285 190 L285 227" stroke="#172433" stroke-width="2.4" fill="none"/><text x="308" y="145" font-size="18">δ+</text><text x="450" y="146" font-size="18">δ−</text><text x="200" y="64" font-size="27">N</text><text x="200" y="25" font-size="27">H</text><text x="125" y="64" font-size="27">H</text><text x="275" y="64" font-size="27">H</text><path d="M200 31 L200 42" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M142 55 L180 55" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M220 55 L258 55" stroke="#172433" stroke-width="2.4" fill="none"/><circle cx="196" cy="84" r="2.5"/><circle cx="204" cy="84" r="2.5"/><path d="M200 84 C245 88 285 110 285 150" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><path d="M352 171 C372 224 445 230 425 190" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><text x="340" y="298" font-size="20">Then a second NH₃ accepts H⁺</text><text x="180" y="390" font-size="27">CH₃CH₂</text><text x="350" y="390" font-size="27">N</text><text x="376" y="366" font-size="22">+</text><text x="350" y="320" font-size="27">H</text><text x="350" y="460" font-size="27">H</text><text x="465" y="390" font-size="27">H</text><path d="M234 381 L332 381" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M350 330 L350 360" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M350 402 L350 437" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M370 381 L444 381" stroke="#172433" stroke-width="2.4" fill="none"/><text x="550" y="310" font-size="27">NH₃</text><circle cx="546" cy="330" r="2.5"/><circle cx="554" cy="330" r="2.5"/><text x="558" y="430" font-size="27">Br⁻</text><path d="M550 330 C547 368 511 381 484 381" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><path d="M409 381 C412 430 363 428 356 402" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><text x="340" y="540" font-size="27">CH₃CH₂NH₂  +  NH₄⁺  +  Br⁻</text><text x="340" y="580" font-size="18">N: 3 bonds + lone pair → 4 bonds, + → 3 bonds + lone pair</text></g></svg>