<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Carbon-end attack by cyanide</title><desc id="desc">The carbon lone pair of cyanide attacks the carbon bonded to bromine. The carbon bromine pair goes to bromine. Bromoethane gives propanenitrile, with three carbons.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker></defs><rect width="680" height="340" fill="#fff"/><g fill="#172433" font-family="Arial, sans-serif" font-size="27" text-anchor="middle"><text x="150" y="180" font-size="27">CH₃</text><text x="285" y="180" font-size="27">C</text><text x="425" y="180" font-size="27">Br</text><text x="285" y="111" font-size="27">H</text><text x="285" y="250" font-size="27">H</text><path d="M181 171 L266 171" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M304 171 L400 171" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M285 120 L285 150" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M285 190 L285 227" stroke="#172433" stroke-width="2.4" fill="none"/><text x="308" y="145" font-size="18">δ+</text><text x="450" y="146" font-size="18">δ−</text><text x="200" y="64" font-size="27">C</text><text x="275" y="64" font-size="27">N</text><path d="M219 48 L255 48" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M219 56 L255 56" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M219 64 L255 64" stroke="#172433" stroke-width="2.4" fill="none"/><circle cx="165" cy="57" r="2.5"/><circle cx="173" cy="57" r="2.5"/><text x="168" y="35" font-size="20">−</text><path d="M169 57 C185 108 272 105 285 150" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><path d="M352 171 C372 224 445 230 425 190" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><text x="340" y="310" font-size="27">CH₃CH₂C≡N  +  Br⁻</text><text x="470" y="45" font-size="18">CN⁻; aqueous ethanol; heat</text></g></svg>