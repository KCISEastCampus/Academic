<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img" aria-labelledby="title desc"><title id="title">Elimination answer for 1-bromopropane</title><desc id="desc">OH minus removes a hydrogen from the middle carbon; that C H pair forms a pi bond between middle and terminal carbons; the carbon bromine pair goes to bromine. Propene, water and bromide result.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker></defs><rect width="680" height="370" fill="#fff"/><g fill="#172433" font-family="Arial, sans-serif" font-size="27" text-anchor="middle"><text x="95" y="190" font-size="27">CH₃</text><text x="240" y="190" font-size="27">C</text><text x="400" y="190" font-size="27">C</text><text x="540" y="190" font-size="27">H</text><text x="240" y="110" font-size="27">H</text><text x="400" y="110" font-size="27">H</text><text x="240" y="267" font-size="27">H</text><text x="400" y="267" font-size="27">Br</text><path d="M126 181 L220 181" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M260 181 L380 181" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M420 181 L523 181" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M240 120 L240 161" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M400 120 L400 161" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M240 202 L240 242" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M400 202 L400 242" stroke="#172433" stroke-width="2.4" fill="none"/><text x="80" y="90" font-size="27">O</text><text x="53" y="90" font-size="27">H</text><text x="72" y="66" font-size="20">−</text><circle cx="104" cy="78" r="2.5"/><circle cx="104" cy="86" r="2.5"/><path d="M104 82 C148 37 221 43 236 87" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><path d="M240 140 C279 110 321 127 320 179" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><path d="M400 221 C463 207 464 278 420 261" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><text x="468" y="40" font-size="20">KOH in ethanol; heat</text><text x="340" y="335" font-size="27">CH₃CH=CH₂  +  H₂O  +  Br⁻</text></g></svg>