<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Hydroxide substitution: bromoethane to ethanol</title><desc id="desc">An oxygen lone pair of OH minus moves to the partially positive carbon. The carbon bromine pair moves to bromine. Products are ethanol and bromide; net charge remains minus one.</desc><defs><marker id="pair" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#a12545"/></marker></defs><rect width="680" height="340" fill="#fff"/><g fill="#172433" font-family="Arial, sans-serif" font-size="27" text-anchor="middle"><text x="150" y="180" font-size="27">CH₃</text><text x="285" y="180" font-size="27">C</text><text x="425" y="180" font-size="27">Br</text><text x="285" y="111" font-size="27">H</text><text x="285" y="250" font-size="27">H</text><path d="M181 171 L266 171" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M304 171 L400 171" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M285 120 L285 150" stroke="#172433" stroke-width="2.4" fill="none"/><path d="M285 190 L285 227" stroke="#172433" stroke-width="2.4" fill="none"/><text x="308" y="145" font-size="18">δ+</text><text x="450" y="146" font-size="18">δ−</text><text x="200" y="64" font-size="27">O</text><text x="228" y="64" font-size="27">H</text><text x="183" y="44" font-size="20">−</text><circle cx="196" cy="84" r="2.5"/><circle cx="204" cy="84" r="2.5"/><path d="M200 84 C245 88 285 110 285 150" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><path d="M352 171 C372 224 445 230 425 190" stroke="#a12545" stroke-width="2.6" fill="none" marker-end="url(#pair)"/><text x="340" y="310" font-size="27">CH₃CH₂OH  +  Br⁻</text><text x="340" y="28" font-size="20">OH⁻(aq); warm</text></g></svg>