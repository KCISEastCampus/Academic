<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280" role="img" aria-labelledby="t d"><title id="t">New constructed isotope spectrum</title><desc id="d">Mononuclear 1+ ions: peaks m/z 24, 25, 26 have relative responses 79, 10, 11.</desc><rect width="520" height="280" fill="white"/><g font-family="Arial,sans-serif" font-size="17" fill="#172b4d"><path d="M70 32V220H480" fill="none" stroke="#172b4d" stroke-width="2"/><text x="6" y="21">Relative response</text><text x="445" y="253">m/z</text><text x="45" y="225">0</text><text x="35" y="184">20</text><text x="35" y="142">40</text><text x="35" y="100">60</text><text x="35" y="58">80</text><path d="M70 178H480M70 136H480M70 94H480M70 52H480" stroke="#cbd5e1" stroke-dasharray="4 4"/><path d="M140 220V54.1M280 220V199M420 220V196.9" stroke="#0369a1" stroke-width="5"/><text x="128" y="248">24</text><text x="268" y="248">25</text><text x="408" y="248">26</text><text x="153" y="61">79</text><text x="286" y="188">10</text><text x="427" y="186">11</text><text x="90" y="274" font-size="14">Constructed data; all ions have charge +1.</text></g></svg>