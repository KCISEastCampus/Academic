<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280" role="img" aria-labelledby="title desc"><title id="title">Constructed elemental mass spectrum</title><desc id="desc">Singly charged mononuclear ions have peaks at m over z 10 and 11, with relative responses 20 and 80. No peak is required at the weighted mean.</desc><rect width="520" height="280" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#172b4d"><path d="M70 32V220H475" fill="none" stroke="#172b4d" stroke-width="2"/><text x="9" y="21">Relative response</text><text x="444" y="253">m/z</text><text x="45" y="226">0</text><text x="35" y="184">20</text><text x="35" y="142">40</text><text x="35" y="100">60</text><text x="35" y="58">80</text><path d="M70 178H475M70 136H475M70 94H475M70 52H475" stroke="#cbd5e1" stroke-dasharray="4 4"/><path d="M140 220V178M380 220V52" stroke="#0369a1" stroke-width="5"/><text x="129" y="248">10</text><text x="369" y="248">11</text><text x="103" y="164">20</text><text x="393" y="61">80</text><text x="86" y="274" font-size="14">Constructed data; peak position is not the mixture mean.</text></g></svg>