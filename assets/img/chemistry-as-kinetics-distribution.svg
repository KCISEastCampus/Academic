<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img" aria-labelledby="title desc">
<title id="title">Illustrative normalised molecular-energy distributions</title>
<desc id="desc">Constructed Maxwell–Boltzmann energy-density curves, not measurements; energy units are illustrative. Top: two curves of equal total area one at lower T1 and higher T2. The hotter curve has a lower peak further right and a larger high-energy tail beyond a shared Ea. Bottom: one unchanged T1 curve with lower catalytic and higher uncatalysed thresholds; molecules between thresholds can use the catalytic route. Curves have long tails; the finite drawing window is not a maximum molecular energy. Probability density vertically and molecular energy horizontally.</desc>
<rect width="600" height="780" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172b4d" font-size="21">
