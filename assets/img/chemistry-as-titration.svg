<title id="title">Titration apparatus and meniscus reading</title>
<desc id="desc">A clamped burette delivers solution to a conical flask on a white tile. A magnified scale increases downwards, and the eye is level with the bottom of the meniscus. A separate volumetric pipette has a filler. Schematic, not to scale.</desc>
