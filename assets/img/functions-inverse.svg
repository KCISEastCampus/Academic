<svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-labelledby="title desc">
<title id="title">A function and its inverse</title>
<desc id="desc">The graphs of y equals x squared for x greater than or equal to zero and y equals the square root of x are reflections in y equals x. The point 2,4 reflects to 4,2. Both axes use the same scale.</desc>
