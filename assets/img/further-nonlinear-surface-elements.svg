<title id="title">Radius, curved length and horizontal width</title>
<desc id="desc">The generating curve y equals inverse hyperbolic cosine of x runs from x equals 1 to 2 above the x axis. A vertical two-ended arrow measures radius y to the axis. A thick curved segment labelled ds is longer than its dashed horizontal projection labelled dx. The drawing shows a generating curve, not an unfolded three-dimensional surface.</desc>
