<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="t d"><title id="t">Triangle on a unit grid</title><desc id="d">A(1,1), B(3,1), C(1,2), mirror line x=0.</desc><rect width="500" height="500" fill="white"/><path d="M45 50V455 M45 455H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="40" y="295">-4</text><text x="205" y="460">-4</text></g><path d="M90 50V455 M45 410H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="85" y="295">-3</text><text x="205" y="415">-3</text></g><path d="M135 50V455 M45 365H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="130" y="295">-2</text><text x="205" y="370">-2</text></g><path d="M180 50V455 M45 320H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="175" y="295">-1</text><text x="205" y="325">-1</text></g><path d="M225 50V455 M45 275H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="220" y="295">0</text><text x="205" y="280">0</text></g><path d="M270 50V455 M45 230H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="265" y="295">1</text><text x="205" y="235">1</text></g><path d="M315 50V455 M45 185H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="310" y="295">2</text><text x="205" y="190">2</text></g><path d="M360 50V455 M45 140H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="355" y="295">3</text><text x="205" y="145">3</text></g><path d="M405 50V455 M45 95H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="400" y="295">4</text><text x="205" y="100">4</text></g><path d="M450 50V455 M45 50H450" stroke="#d4dce5"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="15"><text x="445" y="295">5</text><text x="205" y="55">5</text></g><path d="M45 275H465 M225 455V35" stroke="#162b45" stroke-width="2"/><path d="M225 455V50" stroke="#8b3e17" stroke-width="3" stroke-dasharray="7 5"/><polygon points="270,230 360,230 270,185" fill="#dbeafe" stroke="#174a78" stroke-width="3"/><g fill="#162b45" font-family="Arial,sans-serif" font-size="18"><text x="269" y="250">A</text><text x="367" y="235">B</text><text x="271" y="176">C</text><text x="465" y="270">x</text><text x="235" y="35">y</text><text x="60" y="35">1 square = 1 unit</text><text x="240" y="445">x = 0</text></g></svg>
