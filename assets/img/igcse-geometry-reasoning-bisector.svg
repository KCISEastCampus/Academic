<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" role="img" aria-labelledby="title desc">
<title id="title">Equal arcs establish the bisector</title><desc id="desc">A and B lie on a horizontal segment. Arcs of radius 150 centred at A and B meet at X and Y. XY crosses AB at its midpoint.</desc>
<rect width="580" height="330" fill="#fff"/>
<g fill="none" stroke="#18334a" stroke-width="2.5" stroke-linejoin="round"><path d="M110 170H330 M220 38V302" stroke="#18334a"/><path d="M200 50 A150 150 0 0 1 200 290 M240 50 A150 150 0 0 0 240 290" stroke="#7b5725"/><circle cx="110" cy="170" r="3" fill="#18334a"/><circle cx="330" cy="170" r="3" fill="#18334a"/><path d="M220 170H232V182H220"/><text x="92" y="199" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">A</text><text x="332" y="199" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">B</text><text x="227" y="65" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">X</text><text x="227" y="297" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">Y</text><text x="375" y="165" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">AX = BX</text><text x="375" y="197" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">AY = BY</text></g>
</svg>
