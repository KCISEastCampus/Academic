<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 310" role="img" aria-labelledby="title desc">
<title id="title">Triangle and line notation</title><desc id="desc">Triangle ABC has side a opposite A, b opposite B and c opposite C. On the right lines p and q are parallel and line r is perpendicular to them.</desc>
<rect width="610" height="310" fill="#fff"/>
<g fill="none" stroke="#18334a" stroke-width="2.5" stroke-linejoin="round"><path d="M75 65V250H225Z"/><text x="50" y="57" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">A</text><text x="50" y="275" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">B</text><text x="226" y="275" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">C</text><text x="145" y="277" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">a</text><text x="157" y="153" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">b</text><text x="48" y="165" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">c</text><path d="M320 110H570 M320 220H570 M445 45V280 M445 110H460V125H445 M445 220H460V235H445 M365 102L376 110L365 118 M365 212L376 220L365 228"/><text x="574" y="116" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">p</text><text x="574" y="225" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">q</text><text x="454" y="43" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">r</text></g>
</svg>
