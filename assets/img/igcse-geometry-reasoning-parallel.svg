<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 295" role="img" aria-labelledby="title desc">
<title id="title">Numbered parallel-line angles</title><desc id="desc">At each intersection four angles are numbered clockwise from upper left, 1 to 4 at p and 5 to 8 at q. Matching arrow marks show p parallel q.</desc>
<rect width="610" height="295" fill="#fff"/>
<g fill="none" stroke="#18334a" stroke-width="2.5" stroke-linejoin="round"><path d="M35 90H565 M35 220H565 M158.28 270L285.66 20 M90 82L101 90L90 98 M90 212L101 220L90 228"/><text x="570" y="97" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">p</text><text x="570" y="227" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">q</text><text x="210" y="73" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">1</text><text x="273" y="73" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">2</text><text x="262" y="121" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">3</text><text x="210" y="121" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">4</text><text x="145" y="203" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">5</text><text x="210" y="203" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">6</text><text x="200" y="251" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">7</text><text x="145" y="251" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="30">8</text></g>
</svg>
