<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 290" role="img" aria-labelledby="title desc">
<title id="title">Similar triangles with rotated correspondence</title><desc id="desc">ABC and PQR are corresponding right triangles. AB is 3, BC is 4 and CA is 5; PQ is 6, QR is 8 and PR is unlabelled. The drawings use the same length scale.</desc>
<rect width="550" height="290" fill="#fff"/>
<g fill="none" stroke="#18334a" stroke-width="2.5" stroke-linejoin="round"><path d="M45 235H105V155Z M330 235V115H490Z M95 235V225H105 M330 125H340V115"/><text x="23" y="260" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">A</text><text x="108" y="260" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">B</text><text x="105" y="150" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">C</text><text x="64" y="260" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">3</text><text x="111" y="207" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">4</text><text x="50" y="192" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">5</text><text x="305" y="259" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">P</text><text x="305" y="108" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">Q</text><text x="495" y="117" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">R</text><text x="304" y="181" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">6</text><text x="404" y="109" fill="#18334a" stroke="none" font-family="Arial,sans-serif" font-size="28">8</text></g>
</svg>
