<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="title desc"><title id="title">Constructed travel choices</title><desc id="desc">Walk 6 people, Bus 4, Cycle 2. Separate bars with gaps, equal widths, frequency axis starts at zero.</desc><rect width="520" height="330" fill="white"/><g font-family="Arial,sans-serif" font-size="22" fill="#182f4b"><text x="70" y="23" text-anchor="start">People</text><path d="M70 260L470 260" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="265" text-anchor="end">0</text><path d="M70 200L470 200" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="205" text-anchor="end">2</text><path d="M70 140L470 140" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="145" text-anchor="end">4</text><path d="M70 80L470 80" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="85" text-anchor="end">6</text><rect x="100" y="80" width="65" height="180" fill="#b9d8ed" stroke="#234d6a" stroke-width="2"/><text x="133" y="287" text-anchor="middle">Walk</text><rect x="230" y="140" width="65" height="120" fill="#b9d8ed" stroke="#234d6a" stroke-width="2"/><text x="263" y="287" text-anchor="middle">Bus</text><rect x="360" y="200" width="65" height="60" fill="#b9d8ed" stroke="#234d6a" stroke-width="2"/><text x="393" y="287" text-anchor="middle">Cycle</text><path d="M70 45L70 260" fill="none" stroke="#182f4b" stroke-width="2"/><path d="M70 260L480 260" fill="none" stroke="#182f4b" stroke-width="2"/></g></svg>
