<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="title desc"><title id="title">Constructed attendance: dual bars</title><desc id="desc">A values 4, 6, 5; B values 6, 3, 7 for Monday, Tuesday, Wednesday. Blue labelled A, gold labelled B.</desc><rect width="520" height="330" fill="white"/><g font-family="Arial,sans-serif" font-size="22" fill="#182f4b"><text x="70" y="23" text-anchor="start">Attendance (people)</text><path d="M70 260L470 260" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="265" text-anchor="end">0</text><path d="M70 215L470 215" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="220" text-anchor="end">3</text><path d="M70 170L470 170" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="175" text-anchor="end">6</text><path d="M70 125L470 125" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="130" text-anchor="end">9</text><path d="M70 80L470 80" fill="none" stroke="#d3dbe4" stroke-width="2"/><text x="58" y="85" text-anchor="end">12</text><rect x="98" y="200" width="35" height="60" fill="#b9d8ed" stroke="#234d6a" stroke-width="2"/><rect x="138" y="170" width="35" height="90" fill="#f4d49b" stroke="#234d6a" stroke-width="2"/><text x="135" y="286" text-anchor="middle">Mon</text><rect x="228" y="170" width="35" height="90" fill="#b9d8ed" stroke="#234d6a" stroke-width="2"/><rect x="268" y="215" width="35" height="45" fill="#f4d49b" stroke="#234d6a" stroke-width="2"/><text x="265" y="286" text-anchor="middle">Tue</text><rect x="358" y="185" width="35" height="75" fill="#b9d8ed" stroke="#234d6a" stroke-width="2"/><rect x="398" y="155" width="35" height="105" fill="#f4d49b" stroke="#234d6a" stroke-width="2"/><text x="395" y="286" text-anchor="middle">Wed</text><path d="M70 50L70 260" fill="none" stroke="#182f4b" stroke-width="2"/><path d="M70 260L480 260" fill="none" stroke="#182f4b" stroke-width="2"/><rect x="290" y="8" width="18" height="15" fill="#b9d8ed" stroke="#234