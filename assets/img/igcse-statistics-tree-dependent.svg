<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="title desc"><title id="title">Constructed probability tree</title><desc id="desc">First branch [&#x27;R&#x27;, &#x27;B&#x27;] probabilities [&#x27;3/5&#x27;, &#x27;2/5&#x27;]. Second branch probabilities [[&#x27;2/4&#x27;, &#x27;2/4&#x27;], [&#x27;3/4&#x27;, &#x27;1/4&#x27;]]. End paths RR: 3/10, RB: 3/10, BR: 3/10, BB: 1/10.</desc><rect width="560" height="350" fill="white"/><g font-family="Arial,sans-serif" font-size="23" fill="#182f4b"><text x="35" y="185" text-anchor="middle">Start</text><path d="M60 180L210 95" fill="none" stroke="#182f4b" stroke-width="2"/><text x="140" y="127.5" text-anchor="middle">3/5</text><text x="212" y="83" text-anchor="middle">R</text><path d="M220 95L385 45" fill="none" stroke="#182f4b" stroke-width="2"/><text x="300" y="62.0" text-anchor="middle">R 2/4</text><text x="405" y="50" text-anchor="start">RR: 3/10</text><path d="M220 95L385 135" fill="none" stroke="#182f4b" stroke-width="2"/><text x="300" y="107.0" text-anchor="middle">B 2/4</text><text x="405" y="140" text-anchor="start">RB: 3/10</text><path d="M60 180L210 265" fill="none" stroke="#182f4b" stroke-width="2"/><text x="140" y="212.5" text-anchor="middle">2/5</text><text x="212" y="253" text-anchor="middle">B</text><path d="M220 265L385 225" fill="none" stroke="#182f4b" stroke-width="2"/><text x="300" y="237.0" text-anchor="middle">R 3/4</text><text x="405" y="230" text-anchor="start">BR: 3/10</text><path d="M220 265L385 315" fill="none" stroke="#182f4b" stroke-width="2"/><text x="300" y="282.0" text-anchor="middle">B 1/4</text><text x="405" y="320" text-anchor="start">BB: 1/10</text></g></svg>
