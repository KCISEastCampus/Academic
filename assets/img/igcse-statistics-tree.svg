<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="title desc"><title id="title">Constructed probability tree</title><desc id="desc">First branch [&#x27;H&#x27;, &#x27;T&#x27;] probabilities [&#x27;1/2&#x27;, &#x27;1/2&#x27;]. Second branch probabilities [[&#x27;1/3&#x27;, &#x27;2/3&#x27;], [&#x27;1/3&#x27;, &#x27;2/3&#x27;]]. End paths HR: 1/6, HG: 1/3, TR: 1/6, TG: 1/3.</desc><rect width="560" height="350" fill="white"/><g font-family="Arial,sans-serif" font-size="23" fill="#182f4b"><text x="35" y="185" text-anchor="middle">Start</text><path d="M60 180L210 95" fill="none" stroke="#182f4b" stroke-width="2"/><text x="140" y="127.5" text-anchor="middle">1/2</text><text x="212" y="83" text-anchor="middle">H</text><path d="M220 95L385 45" fill="none" stroke="#182f4b" stroke-width="2"/><text x="300" y="62.0" text-anchor="middle">R 1/3</text><text x="405" y="50" text-anchor="start">HR: 1/6</text><path d="M220 95L385 135" fill="none" stroke="#182f4b" stroke-width="2"/><text x="300" y="107.0" text-anchor="middle">G 2/3</text><text x="405" y="140" text-anchor="start">HG: 1/3</text><path d="M60 180L210 265" fill="none" stroke="#182f4b" stroke-width="2"/><text x="140" y="212.5" text-anchor="middle">1/2</text><text x="212" y="253" text-anchor="middle">T</text><path d="M220 265L385 225" fill="none" stroke="#182f4b" stroke-width="2"/><text x="300" y="237.0" text-anchor="middle">R 1/3</text><text x="405" y="230" text-anchor="start">TR: 1/6</text><path d="M220 265L385 315" fill="none" stroke="#182f4b" stroke-width="2"/><text x="300" y="282.0" text-anchor="middle">G 2/3</text><text x="405" y="320" text-anchor="start">TG: 1/3</text></g></svg>
