<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="title desc"><title id="title">Constructed two-set Venn diagram</title><desc id="desc">A only 10; intersection 8; B only 6; neither 6. Rectangle is the universal set.</desc><rect width="520" height="330" fill="white"/><g font-family="Arial,sans-serif" font-size="22" fill="#182f4b"><rect x="20" y="35" width="480" height="250" fill="#fff" stroke="#234d6a" stroke-width="2"/><text x="37" y="60" text-anchor="start">ξ</text><circle cx="205" cy="155" r="95" fill="#b9d8ed" fill-opacity="0.4" stroke="#234d6a" stroke-width="2"/><circle cx="315" cy="155" r="95" fill="none" stroke="#234d6a" stroke-width="2"/><text x="150" y="75" text-anchor="middle">A</text><text x="370" y="75" text-anchor="middle">B</text><text x="163" y="160" text-anchor="middle">10</text><text x="260" y="160" text-anchor="middle">8</text><text x="356" y="160" text-anchor="middle">6</text><text x="260" y="273" text-anchor="middle">6</text></g></svg>
