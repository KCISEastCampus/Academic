<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" role="img" aria-labelledby="title desc">
<title id="title">Permanent dipole–dipole attraction</title><desc id="desc">Each neutral polar molecule has a partially positive and a partially negative end. Opposite partial charges on neighbouring molecules attract.</desc>
<rect width="360" height="170" rx="8" fill="white"/>
<g font-family="Arial, sans-serif" fill="#153c59" text-anchor="middle">
<text x="180" y="25" font-size="17">Permanent dipole–dipole attraction</text>
<g stroke="#315f85" stroke-width="2"><ellipse cx="60" cy="77" rx="32" ry="25" fill="#ffe1a8"/><ellipse cx="111" cy="77" rx="32" ry="25" fill="#b9dcff"/><ellipse cx="249" cy="77" rx="32" ry="25" fill="#ffe1a8"/><ellipse cx="300" cy="77" rx="32" ry="25" fill="#b9dcff"/></g>
<g font-size="21"><text x="58" y="84">δ+</text><text x="113" y="84">δ−</text><text x="247" y="84">δ+</text><text x="302" y="84">δ−</text></g>
<path d="M146 77H213" stroke="#315f85" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="86" y="120" font-size="15">neutral molecule A</text><text x="274" y="120" font-size="15">neutral molecule B</text>
<text x="180" y="150" font-size="15">Dashed link: intermolecular attraction</text>
</g></svg>
