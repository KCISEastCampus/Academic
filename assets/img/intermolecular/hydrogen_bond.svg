<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-labelledby="title desc">
<title id="title">Hydrogen bond between water molecules</title><desc id="desc">An O–H covalent bond is drawn as a solid line. The partially positive hydrogen forms a hydrogen bond, shown as a dashed line, to a lone pair on the oxygen of another complete water molecule. Each oxygen has two lone pairs.</desc>
<rect width="360" height="200" rx="8" fill="white"/>
<g font-family="Arial, sans-serif" fill="#153c59" text-anchor="middle">
<text x="180" y="25" font-size="18">Hydrogen bonding in water</text>
<g stroke="#153c59" stroke-width="2.5"><path d="M73 82H111M61 96L46 120M232 74L274 56M232 92L274 120"/></g>
<g fill="#b9dcff" stroke="#315f85" stroke-width="2"><circle cx="63" cy="82" r="18"/><circle cx="220" cy="82" r="18"/></g>
<g font-size="21"><text x="63" y="89">O</text><text x="124" y="89">H</text><text x="40" y="140">H</text><text x="220" y="89">O</text><text x="287" y="57">H</text><text x="287" y="140">H</text></g>
<g fill="#153c59"><circle cx="47" cy="51" r="2.5"/><circle cx="54" cy="51" r="2.5"/><circle cx="80" cy="51" r="2.5"/><circle cx="87" cy="51" r="2.5"/><circle cx="190" cy="78" r="2.5"/><circle cx="190" cy="86" r="2.5"/><circle cx="216" cy="52" r="2.5"/><circle cx="224" cy="52" r="2.5"/></g>
<path d="M138 82H182" stroke="#315f85" stroke-width="2.5" stroke-dasharray="5 4"/>
<g font-size="14"><text x="124" y="61">δ+</text><text x="234" y="48">δ−</text><text x="63" y="170">donor water</text><text x="244" y="170">acceptor water</text><text x="180" y="192">Solid: covalent bond · Dashed: hydrogen bond</text></g>
</g></svg>
