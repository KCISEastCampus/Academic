<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190" role="img" aria-labelledby="title desc">
<title id="title">London dispersion: instantaneous and induced dipoles</title><desc id="desc">A fluctuation in one electron cloud creates an instantaneous dipole, inducing a dipole in its neighbour. Opposite adjacent partial charges attract. The displayed dipoles are temporary and both particles remain neutral.</desc>
<rect width="360" height="190" rx="8" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315f85"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#153c59" text-anchor="middle">
<text x="180" y="24" font-size="17">London dispersion (one instant)</text>
<text x="80" y="52" font-size="14">instantaneous dipole</text><text x="280" y="52" font-size="14">induced dipole</text>
<path d="M158 47H205" stroke="#315f85" stroke-width="2" marker-end="url(#arrow)"/>
<g stroke="#315f85" stroke-width="2"><ellipse cx="53" cy="98" rx="30" ry="25" fill="#ffe1a8"/><ellipse cx="104" cy="98" rx="30" ry="25" fill="#b9dcff"/><ellipse cx="254" cy="98" rx="30" ry="25" fill="#ffe1a8"/><ellipse cx="305" cy="98" rx="30" ry="25" fill="#b9dcff"/></g>
<g font-size="21"><text x="52" y="105">δ+</text><text x="106" y="105">δ−</text><text x="252" y="105">δ+</text><text x="307" y="105">δ−</text></g>
<path d="M138 98H219" stroke="#315f85" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="180" y="149" font-size="14">Dashed link: attraction between dipoles</text><text x="180" y="176" font-size="14">Electron clouds fluctuate; dipoles are temporary.</text>
</g></svg>
