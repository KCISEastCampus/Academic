<path d="M455,657.5 L455,410" stroke="#e2e8f0"/>
<text x="448" y="610">3</text>
<path d="M510,657.5 L510,410" stroke="#e2e8f0"/>
<text x="503" y="610">4</text>
<path d="M70,635 L510,635" stroke="#e2e8f0"/>
<text x="265" y="640">-1</text>
<path d="M70,590 L510,590" stroke="#e2e8f0"/>
<path d="M70,545 L510,545" stroke="#e2e8f0"/>
<text x="265" y="550">1</text>
