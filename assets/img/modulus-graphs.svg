<circle cx="290" cy="635" r="4" fill="#b45309"/><text x="302" y="666" fill="#b45309">(0, −1)</text></g>
<text x="35" y="682" font-family="Arial, sans-serif" font-size="14" fill="#475569">Dashed grey line: original graph y = x − 1</text></svg>