<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">Unloaded and loaded potential divider</title><desc id="desc">R1 from positive supply to junction X; R2 from X to zero volts. An optional load is in parallel with R2. Output is measured from X to zero volts.</desc><rect width="480" height="330" fill="white"/><g stroke="#17334b" stroke-width="2.5" fill="none"><path d="M95 40H240V75M240 125V165M240 165V200M240 250V295H95M240 165H380V200M380 250V295H240"/><rect x="226" y="75" width="28" height="50"/><rect x="226" y="200" width="28" height="50"/><rect x="366" y="200" width="28" height="50" stroke-dasharray="5 4"/></g><g fill="#17334b" font-family="Arial,sans-serif" font-size="22"><circle cx="240" cy="165" r="4"/><text x="25" y="47">+Vin</text><text x="25" y="302">0 V</text><text x="185" y="108">R1</text><text x="185" y="233">R2</text><text x="255" y="155">X: Vout</text><text x="327" y="280">load</text><text x="25" y="321" font-size="18">Output reference: lower terminal</text></g></svg>
