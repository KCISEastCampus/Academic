<svg xmlns="http://www.w3.org/2000/svg" width="400" height="620" viewBox="0 0 400 620" role="img" aria-labelledby="title desc"><title id="title">Polarisation and connection conditions</title><desc id="desc">Positive plate above negative plate. Polar molecules align negative ends upwards and positive ends downwards. Bound charge gives a polarisation field upwards opposing the plate field downwards. Connected voltage fixed, isolated free charge fixed.</desc><rect width="400" height="620" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172033" font-size="15"><defs><marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#007e91"/></marker><marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b06017"/></marker></defs><text x="20" y="32" font-size="19" font-weight="bold">Polar molecules rotate</text><text x="20" y="60">Plate field points downwards</text><rect x="55" y="83" width="290" height="24" rx="4" fill="#fee5c4"/><text x="80" y="101" fill="#92400e">+</text><text x="130" y="101" fill="#92400e">+</text><text x="180" y="101" fill="#92400e">+</text><text x="230" y="101" fill="#92400e">+</text><text x="280" y="101" fill="#92400e">+</text><text x="330" y="101" fill="#92400e">+</text><rect x="85" y="125" width="230" height="180" rx="6" fill="#e2edf3" stroke="#94a3b8"/><text x="105" y="147" fill="#005e8c">−</text><text x="150" y="147" fill="#005e8c">−</text><text x="195" y="147" fill="#005e8c">−</text><text x="240" y="147" fill="#005e8c">−</text><text x="285" y="147" fill="#005e8c">−</text><text x="105" y="292" fill="#92400e">+</text><text x="150" y="292" fill="#92400e">+</text><text x="195" y="292" fill="#92400e">+</text><text x="240" y="292" fill="#92400e">+</text><text x="285" y="292" fill="#92400e">+</text><rect x="55" y="325" width="290" height="24" rx="4" fill="#d4eafc"/><text x="80" y="343" fill="#005e8c">−</text><text x="130" y="343" fill="#005e8c">−</text><text x="180" y="343" fill="#005e8c">−</text><text x="230" y="343" fill="#005e8c">−</text><text x="280" y="343" fill="#005e8c">−</text><text x="330" y="343" fill="#005e8c">−</text><path d="M45 145 V292" stroke="#007e91" stroke-width="3" /><path d="M39 280 L45 294 L51 280 Z" fill="#007e91"/><path d="M349 162 L355 148 L361 162 Z" fill="#b06017"/><path d="M355 290 V150" stroke="#b06017" stroke-width="3" /><path d="M125 190 V241" stroke="#64748b" stroke-width="2"/><circle cx="125" cy="190" r="13" fill="#d4eafc"/><circle cx="125" cy="241" r="13" fill="#fee5c4"/><text x="120" y="195" fill="#005e8c">−</text><text x="120" y="246" fill="#92400e">+</text><path d="M200 190 V241" stroke="#64748b" stroke-width="2"/><circle cx="200" cy="190" r="13" fill="#d4eafc"/><circle cx="200" cy="241" r="13" fill="#fee5c4"/><text x="195" y="195" fill="#005e8c">−</text><text x="195" y="246" fill="#92400e">+</text><path d="M275 190 V241" stroke="#64748b" stroke-width="2"/><circle cx="275" cy="190" r="13" fill="#d4eafc"/><circle cx="275" cy="241" r="13" fill="#fee5c4"/><text x="270" y="195" fill="#005e8c">−</text><text x="270" y="246" fill="#92400e">+</text><text x="20" y="378" fill="#b06017">Polarisation field points upwards</text><text x="20" y="405">Surface signs are bound charges.</text><text x="20" y="429">The dielectric stays neutral overall.</text><rect x="20" y="453" width="360" height="65" rx="7" fill="#e2f1ed"/><text x="34" y="477" font-weight="bold">Connected supply: fixed V</text><text x="34" y="500">More free charge flows onto the plates.</text><rect x="20" y="530" width="360" height="65" rx="7" fill="#e5edf8"/><text x="34" y="554" font-weight="bold">Isolated capacitor: fixed free Q</text><text x="34" y="577">No external path for charge transfer.</text></g></svg>
