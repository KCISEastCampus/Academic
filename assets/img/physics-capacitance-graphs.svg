<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-labelledby="title desc"><title id="title">Capacitor graphs: read the axes</title><desc id="desc">A three microfarad capacitor reaches twenty four microcoulombs at eight volts. Charge against voltage has slope C. Voltage against charge has slope one over C and area ninety six microjoules.</desc><rect width="400" height="600" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172033" font-size="15"><text x="24" y="32" font-weight="bold" font-size="19">Read the axes first</text><text x="24" y="60">Same capacitor: C = 3.0 μF</text>
<text x="24" y="98" font-weight="bold">Charge against voltage</text><text x="25" y="127">Q / μC</text><path d="M65 145 V285 H355" stroke="#475569" fill="none" stroke-width="2"/><path d="M65 285 L325 155" stroke="#007e91" stroke-width="3"/><path d="M325 155 V285 M65 155 H325" stroke="#94a3b8" stroke-dasharray="5 4" fill="none"/><text x="38" y="160">24</text><text x="49" y="302">0</text><text x="320" y="302">8</text><text x="320" y="326">V / V</text><text x="100" y="180" fill="#007e91">Gradient = C</text><text x="100" y="201" fill="#007e91">= 3.0 μC / V</text>
<text x="24" y="361" font-weight="bold">Voltage against charge</text><text x="25" y="390">V / V</text><path d="M65 405 V545 H355" stroke="#475569" fill="none" stroke-width="2"/><path d="M65 545 L325 415 V545 Z" fill="#b9e5db"/><path d="M65 545 L325 415" stroke="#007e91" stroke-width="3"/><path d="M325 415 V545 M65 415 H325" stroke="#94a3b8" stroke-dasharray="5 4" fill="none"/><text x="44" y="420">8</text><text x="49" y="564">0</text><text x="316" y="564">24</text><text x="299" y="588">Q / μC</text><text x="92" y="435" fill="#007e91">Gradient = 1/C</text><text x="92" y="456" fill="#007e91">= 0.33 V / μC</text><text x="197" y="515">Area = 96 μJ</text></g></svg>
