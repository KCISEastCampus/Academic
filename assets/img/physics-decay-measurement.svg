<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="title desc">
  <title id="title">From radioactive nuclei to detected counts</title>
  <desc id="desc">A model of one parent isotope connects undecayed nuclei to activity, detected source rate, total rate including background, and expected counts integrated over a recording interval. Actual counts fluctuate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="400" height="500" rx="12" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172335">
    <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="24" y="16" width="352" height="60" rx="8"/>
      <rect x="24" y="108" width="352" height="60" rx="8"/>
      <rect x="24" y="200" width="352" height="60" rx="8"/>
      <rect x="24" y="292" width="352" height="60" rx="8"/>
      <rect x="24" y="384" width="352" height="72" rx="8"/>
    </g>
    <g font-size="17" font-weight="600">
      <text x="200" y="42">Undecayed parent nuclei: N</text>
      <text x="200" y="134">Activity: A = λN</text>
      <text x="200" y="226">Detected source rate: r = εA</text>
      <text x="200" y="318">Total rate: source + background</text>
      <text x="200" y="411">Expected counts in a time window</text>
    </g>
    <g font-size="14" fill="#475569">
      <text x="200" y="63">One isotope, constant decay constant</text>
      <text x="200" y="155">Positive decays per second (Bq)</text>
      <text x="200" y="247">Fixed effective detection fraction ε</text>
      <text x="200" y="339">Background rate measured separately</text>
      <text x="200" y="435">Integrate the total rate over the interval</text>
      <text x="200" y="482">Measured counts fluctuate around this expectation.</text>
    </g>
    <g stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M200 78 V103"/>
      <path d="M200 170 V195"/>
      <path d="M200 262 V287"/>
      <path d="M200 354 V379"/>
    </g>
  </g>
</svg>
