<svg xmlns="http://www.w3.org/2000/svg" width="400" height="420" viewBox="0 0 400 420" role="img" aria-labelledby="title desc"><title id="title">Changeover circuit for capacitor charge and discharge</title><desc id="desc">A series resistor, ammeter and capacitor branch is switched between the positive supply and return. A voltmeter is across the capacitor. The charge position is drawn.</desc><rect width="400" height="420" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172033" font-size="16"><text x="20" y="30" font-size="19" font-weight="bold">One branch, two switch positions</text><g stroke="#475569" stroke-width="2" fill="none"><path d="M140 70 H65 V195 M65 210 V350 H340 M140 135 H110 V350 M200 100 H240 V130 M240 180 V202 M240 228 V270 M240 280 V350 M240 245 H340 V259 M340 285 V315 H240"/><path d="M200 100 L140 70" stroke="#007e91" stroke-width="3"/><circle cx="140" cy="70" r="4"/><circle cx="140" cy="135" r="4"/><circle cx="200" cy="100" r="4"/><rect x="231" y="130" width="18" height="50"/><circle cx="240" cy="215" r="13"/><circle cx="340" cy="272" r="13"/><path d="M45 195 H85 M55 210 H75 M219 270 H261 M219 280 H261" stroke-width="3"/></g><text x="152" y="65" fill="#007e91">Charge</text><text x="119" y="159" fill="#b06017">Discharge</text><text x="173" y="122">S</text><text x="32" y="190">+</text><text x="32" y="219">−</text><text x="24" y="250">Vₛ</text><text x="267" y="160">R</text><text x="234" y="221">A</text><text x="334" y="278">V</text><text x="271" y="282">C</text><text x="121" y="372">Common return</text><text x="20" y="402">Supply excluded from discharge loop</text></g></svg>