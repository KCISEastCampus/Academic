<g stroke="#172033" stroke-width="2.5" marker-end="url(#force)"><path d="M208 542L177 477"/><path d="M208 542V621"/></g>
<path d="M208 542L158 566" fill="none" stroke="#287044" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#component)"/>
