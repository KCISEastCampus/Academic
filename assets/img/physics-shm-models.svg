<path d="M130 190H306M306 190V247" fill="none" stroke="#287044" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M306 195V242" stroke="#287044" stroke-width="2" marker-end="url(#component)"/>
<rect x="174" y="228" width="52" height="38" rx="3" fill="#e6edf4" stroke="#172033" stroke-width="2"/>
<g stroke="#172033" stroke-width="2.5" marker-end="url(#force)"><path d="M184 247V156"/><path d="M212 247V315"/></g>
<path d="M130 420H175M150 420V555" fill="none" stroke="#8494a6" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M150 420L208 542" stroke="#527568" stroke-width="3"/>
