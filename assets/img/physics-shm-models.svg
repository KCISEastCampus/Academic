<svg xmlns="http://www.w3.org/2000/svg" width="400" height="680" viewBox="0 0 400 680" role="img" aria-labelledby="title desc">
<title id="title">Vertical spring and pendulum models</title>
<desc id="desc">The top diagram shows a mass below a vertical spring's equilibrium position, with spring force upwards and weight downwards. Downwards is positive displacement. The bottom diagram shows a pendulum displaced to the right. Tension points towards its pivot, weight downwards, and the tangential component of weight towards equilibrium.</desc>
<defs><marker id="force" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#172033"/></marker><marker id="component" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#287044"/></marker></defs>
<rect width="400" height="680" rx="8" fill="white"/>
<g font-family="Arial,sans-serif" fill="#172033" font-size="19"><text x="200" y="30" text-anchor="middle">Vertical spring: x &gt; 0</text><text x="45" y="151">Spring force</text><text x="228" y="312">mg</text><text x="20" y="185">Equilibrium</text><text x="316" y="222">x</text><text x="200" y="339" text-anchor="middle">Displacement measured from equilibrium</text><text x="200" y="387" text-anchor="middle">Pendulum: θ &gt; 0</text><text x="156" y="484">Tension</text><text x="225" y="623">mg</text><text x="167" y="465">θ</text><text x="51" y="607">mg sin θ</text><text x="200" y="659" text-anchor="middle" font-size="17">Tension radial; restoring force tangent</text></g>
