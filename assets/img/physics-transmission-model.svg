<svg width="520" height="350" preserveAspectRatio="xMinYMin meet" viewBox="0 0 520 350" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Two-end transmission model</title><desc>A source and ideal step-up transformer send power through a line to a receiving load. One lumped resistance represents the total outgoing-plus-return line resistance; sending and receiving ends are labelled separately.</desc>
