			<text x="24" y="313" style="font-family: Helvetica; font-size: 19px;fill: rgb(9%,14%,21%); stroke:none;" transform="translate(0,626) scale(1,-1)">Transmission: keep the two ends distinct</text>
			<rect x="25" y="150" width="125" height="110" style="stroke: rgb(9%,14%,21%); stroke-linecap: butt; stroke-width: 1; fill: rgb(95%,96%,98%); fill-rule: evenodd;"/>
