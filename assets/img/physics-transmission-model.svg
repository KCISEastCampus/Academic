			<path d="M 180,230 L 225,230 Z" style="stroke: rgb(61%,18%,27%); stroke-linecap: butt; stroke-width: 2;"/>
			<polygon points="225 230, 217.6315 233.1153, 217.6315 226.8847" style="stroke: rgb(61%,18%,27%); stroke-linecap: butt; stroke-width: 1; fill: rgb(61%,18%,27%); fill-rule: evenodd;"/>
			<text x="202" y="246" style="font-family: Helvetica; font-size: 16px;fill: rgb(61%,18%,27%); stroke:none;" transform="translate(0,492) scale(1,-1)">I</text>
