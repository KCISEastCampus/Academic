			<rect x="400" y="150" width="95" height="110" style="stroke: rgb(9%,14%,21%); stroke-linecap: butt; stroke-width: 1; fill: rgb(95%,96%,98%); fill-rule: evenodd;"/>
			<text x="415.075" y="219" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,14%,21%); stroke:none;" transform="translate(0,438) scale(1,-1)">Receiving</text>
			<text x="433.825" y="193" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,14%,21%); stroke:none;" transform="translate(0,386) scale(1,-1)">load</text>
