<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCISEC Academic 登录</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
      --border: #dbe3ef;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #60a5fa;
        --danger: #f87171;
        --ok: #4ade80;
        --border: #374151;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1, h2 { margin: 0 0 12px; }
    p { margin: 0 0 12px; color: var(--muted); }

    .hidden { display: none !important; }
    .stack { display: grid; gap: 12px; }

    label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
      display: inline-block;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .message {
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 8px;
    }

    .message.error { color: var(--danger); border: 1px solid color-mix(in oklab, var(--danger) 35%, var(--border)); }
    .message.success { color: var(--ok); border: 1px solid color-mix(in oklab, var(--ok) 35%, var(--border)); }

    .resource-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .resource-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-decoration: none;
      color: inherit;
      background: color-mix(in oklab, var(--card) 92%, var(--primary));
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .small { font-size: 13px; }
    code {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 6px;
    }
  </style>
</head>
<body>
  <main class="container">
    <section id="auth-panel" class="card">
      <h1>学术资源登录</h1>
      <p>仅允许指定邮箱域名登录。未登录用户无法查看资源。</p>
      <p class="small">允许域名：<code>@kcischool.com</code>、<code>@kci.edu.cn</code>（可在代码中修改）</p>

      <div class="stack">
        <div>
          <label for="email">邮箱</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@kcischool.com">
        </div>
        <div>
          <label for="password">密码</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
      </div>

      <div class="btn-row">
        <button id="login-btn" class="btn-primary" type="button">登录</button>
        <button id="register-btn" class="btn-ghost" type="button">注册</button>
      </div>

      <div id="auth-message" class="message hidden" role="alert" aria-live="polite"></div>
    </section>

    <section id="resource-panel" class="card hidden" aria-hidden="true" style="margin-top: 16px;">
      <div class="header-row">
        <div>
          <h2>学术资源</h2>
          <p id="welcome-text">欢迎使用资源中心</p>
        </div>
        <button id="logout-btn" class="btn-ghost" type="button">退出登录</button>
      </div>

      <div class="resource-list">
        <a class="resource-item" href="/alevel/">A-Level 课程资源</a>
        <a class="resource-item" href="/igcse/">IGCSE 课程资源</a>
        <a class="resource-item" href="/contributors/">Contributors</a>
        <a class="resource-item" href="/student-council/">Student Council</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script>
    // ===== Supabase 配置（请替换为你的项目值）=====
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    // ===== 可修改的邮箱白名单后缀 =====
    const ALLOWED_EMAIL_DOMAINS = ["@kcischool.com", "@kci.edu.cn"];

    const STORAGE_KEY = "academic_auth_state";
    const authPanel = document.getElementById("auth-panel");
    const resourcePanel = document.getElementById("resource-panel");
    const messageBox = document.getElementById("auth-message");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const welcomeText = document.getElementById("welcome-text");

    function setMessage(text, isError = true) {
      messageBox.textContent = text;
      messageBox.classList.remove("hidden", "error", "success");
      messageBox.classList.add(isError ? "error" : "success");
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.classList.add("hidden");
      messageBox.classList.remove("error", "success");
    }

    function isAllowedEmail(email) {
      const normalized = String(email || "").trim().toLowerCase();
      return ALLOWED_EMAIL_DOMAINS.some(domain => normalized.endsWith(domain));
    }

    function setAuthedUI(user) {
      authPanel.classList.add("hidden");
      resourcePanel.classList.remove("hidden");
      resourcePanel.setAttribute("aria-hidden", "false");
      welcomeText.textContent = `欢迎，${user?.email || "同学"}`;
      clearMessage();
    }

    function setGuestUI() {
      authPanel.classList.remove("hidden");
      resourcePanel.classList.add("hidden");
      resourcePanel.setAttribute("aria-hidden", "true");
      // 未登录自动回登录区域
      authPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function persistLoginState(user) {
      if (!user) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        isLoggedIn: true,
        email: user?.email || ""
      }));
    }

    function hasLocalSessionCache() {
      return Boolean(localStorage.getItem(STORAGE_KEY));
    }

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    });

    async function checkSessionOnLoad() {
      // 占位配置未填，防止误调用
      if (!SUPABASE_URL.startsWith("http") || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY") {
        setGuestUI();
        setMessage("请先在代码中填写 Supabase URL 与 anon key。", true);
        return;
      }

      const { data, error } = await supabase.auth.getSession();
      if (error) {
        setGuestUI();
        setMessage("会话检查失败，请重新登录。", true);
        return;
      }

      const session = data?.session || null;
      if (session?.user) {
        persistLoginState(session.user);
        setAuthedUI(session.user);
      } else {
        if (!hasLocalSessionCache()) {
          setGuestUI();
        } else {
          // 本地有缓存但 Supabase 会话已失效，清理并回登录态
          persistLoginState(null);
          setGuestUI();
        }
      }
    }

    async function handleRegister() {
      clearMessage();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        setMessage("请填写邮箱和密码。");
        return;
      }

      if (!isAllowedEmail(email)) {
        setMessage("该邮箱域名不在白名单内，无法注册。");
        return;
      }

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        setMessage(error.message || "注册失败，请稍后重试。");
        return;
      }
      setMessage("注册成功，请查收邮箱验证邮件后再登录。", false);
    }

    async function handleLogin() {
      clearMessage();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        setMessage("请填写邮箱和密码。");
        return;
      }

      if (!isAllowedEmail(email)) {
        setMessage("该邮箱域名不在白名单内，无法登录。");
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        setMessage(error.message || "登录失败，请检查账号信息。");
        return;
      }

      persistLoginState(data.user || null);
      setAuthedUI(data.user);
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      persistLoginState(null);
      emailInput.value = "";
      passwordInput.value = "";
      setGuestUI();
      setMessage("已退出登录。", false);
    }

    function bindAuthStateListener() {
      supabase.auth.onAuthStateChange((_event, session) => {
        if (session?.user) {
          persistLoginState(session.user);
          setAuthedUI(session.user);
        } else {
          persistLoginState(null);
          setGuestUI();
        }
      });
    }

    document.getElementById("register-btn").addEventListener("click", handleRegister);
    document.getElementById("login-btn").addEventListener("click", handleLogin);
    document.getElementById("logout-btn").addEventListener("click", handleLogout);

    checkSessionOnLoad().finally(() => {
      bindAuthStateListener();
    });
  </script>
</body>
</html>
